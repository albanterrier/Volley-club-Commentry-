<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F2438">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Volley-Club Commentry</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="V2C">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAEFF3; --surface:#FFFFFF; --ink:#0F2438; --muted:#5A6B7C; --line:#C9D4DE;
  --a:#1D5FA8; --a-ink:#FFFFFF; --b:#C2410C; --b-ink:#FFFFFF;
  --gold:#F0B429; --gold-ink:#1A1300; --danger:#B42318;
  --head-bg:#0F2438; --head-ink:#EAF0F5;
  --font-d:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A141E; --surface:#12263A; --ink:#E8EEF3; --muted:#93A5B6; --line:#26405A;
    --a:#5BA0EA; --a-ink:#07121C; --b:#F58A57; --b-ink:#1A0A02;
    --head-bg:#07101A; --head-ink:#E8EEF3;
  }
}
:root[data-theme="dark"]{
  --bg:#0A141E; --surface:#12263A; --ink:#E8EEF3; --muted:#93A5B6; --line:#26405A;
  --a:#5BA0EA; --a-ink:#07121C; --b:#F58A57; --b-ink:#1A0A02;
  --head-bg:#07101A; --head-ink:#E8EEF3;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden;touch-action:pan-y;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;max-width:100%;overflow-x:clip;touch-action:pan-y;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.4;padding-bottom:28px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);margin:0;line-height:1.1}
h2{font-size:26px;font-weight:700}
h3{font-size:20px;font-weight:700;margin-bottom:8px}
small{font-weight:500;opacity:.75}
.muted{color:var(--muted);font-size:14px}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-ink);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:10px 14px}
.hset{display:flex;flex-direction:column;line-height:1.15}
.hset strong{font-family:var(--font-d);font-size:24px;font-weight:700}
.hset span{font-size:13px;opacity:.8}
.clock{display:flex;align-items:center;gap:10px}
header.top .clk{font-family:var(--font-d);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.hbtn{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:8px;min-height:40px;padding:0 12px;font-weight:600}

/* Tableau de score */
main{max-width:720px;margin:0 auto}
.board{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 12px 0}
.swapbtn{position:absolute;left:50%;top:calc(50% + 6px);transform:translate(-50%,-50%);z-index:3;width:46px;height:46px;border-radius:50%;border:3px solid var(--bg);background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.tile{border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:var(--a);color:var(--a-ink)}
.tile.b{background:var(--b);color:var(--b-ink)}
.tilemain{background:none;border:0;color:inherit;padding:14px 8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;width:100%}
.tilemain:disabled{cursor:default}
.tname{font-family:var(--font-d);font-weight:600;font-size:21px;line-height:1.1;overflow-wrap:anywhere}
.score{font-family:var(--font-d);font-weight:800;font-size:clamp(84px,27vw,132px);line-height:.95;font-variant-numeric:tabular-nums}
.hint{font-size:13px;opacity:.85;min-height:18px}
.srv{background:rgba(0,0,0,.2);color:inherit;border:0;min-height:46px;width:100%;font-size:14px;font-weight:500}
.srv.on{background:var(--gold);color:var(--gold-ink);font-weight:700}
.srv:disabled{opacity:.6;cursor:default}

/* Commandes */
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 0}
.col{display:flex;flex-direction:column;gap:8px}
.btn{min-height:50px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font-weight:600;padding:8px 10px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}
.col.a .btn{border-left:6px solid var(--a)}
.col.b .btn{border-left:6px solid var(--b)}
.btn:disabled{opacity:.4;cursor:default}
.btn.wide{justify-content:center;text-align:center;border-left:1px solid var(--line)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 12px 0}
.last{padding:10px 14px 0;font-size:14px;color:var(--muted);margin:0}
.banner{margin:12px 12px 0;padding:12px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack>.banner{margin:0}
.tcbar{margin:12px 12px 0;padding:10px 14px;border-radius:10px;background:var(--gold);color:var(--gold-ink);display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.tcbar button{background:transparent;border:1.5px solid currentColor;border-radius:8px;min-height:38px;padding:0 10px;color:inherit;font-weight:600}

/* Affichage et terrain */
.prefs{display:flex;flex-wrap:wrap;gap:8px;padding:16px 12px 0}
.tg{min-height:44px;font-size:14px;min-width:0}
.courtbox{max-width:360px;margin:0 auto;padding:14px 12px 0}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.cname{font-family:var(--font-d);font-weight:700;font-size:21px;line-height:1.1;display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.cname.a{color:var(--a)}
.cname.b{color:var(--b)}
.cbtns{display:flex;gap:6px;flex-shrink:0}
.court{border:3px solid var(--ink);background:var(--surface);border-radius:3px}
.half{height:196px;display:grid}
.half.top{grid-template-rows:2fr 1fr;background:rgba(29,95,168,.09)}
.half.bot{grid-template-rows:1fr 2fr;background:rgba(194,65,12,.09)}
.rowp{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;align-items:center}
.half .rowp:first-child{border-bottom:2px solid var(--ink)}
.netbar{height:8px;background:var(--ink);margin:0 -9px;border-radius:2px;position:relative;z-index:2}
.pl{width:50px;height:50px;border-radius:50%;border:3px solid var(--a);background:var(--surface);font-family:var(--font-d);font-weight:800;font-size:23px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.pl.b{border-color:var(--b)}
.pl.srv2{box-shadow:0 0 0 4px var(--gold)}
.pl.empty{border-style:dashed;color:var(--muted);font-weight:600}
.mini{min-height:44px;padding:4px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600;font-size:14px;min-width:44px}
.logo{object-fit:contain;background:#fff;border-radius:6px;padding:2px;flex-shrink:0;vertical-align:middle}
.tname{display:flex;align-items:center;justify-content:center;gap:8px}
.tname>span{min-width:0}
.logoedit{display:flex;align-items:center;gap:14px;margin-top:6px}
.logoedit .logo{border:1px solid var(--line)}
.logoedit .logo.none{width:64px;height:64px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}

/* Cartes et formulaires */
.stack{padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.a{border-top:6px solid var(--a)}
.card.b{border-top:6px solid var(--b)}
label.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=time],input[inputmode],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px}
textarea{min-height:120px;font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.plist li{display:flex;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--line)}
.plist input.pnum{width:58px;min-height:44px;text-align:center;font-family:var(--font-d);font-weight:700;font-size:22px;padding:2px}
.plist .nm{flex:1;overflow-wrap:anywhere}
.plist .pos{font-size:13px;color:var(--muted);white-space:nowrap}
.del{border:0;background:transparent;font-size:24px;min-width:44px;min-height:44px;color:var(--muted)}
.addrow{display:grid;grid-template-columns:70px 1fr auto;gap:8px;margin-top:6px;align-items:center}
.addrow2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.res{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.res .btn{min-height:48px}

/* Tableaux */
.tablewrap{overflow-x:auto;max-width:100%;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line)}
th:first-child{z-index:2}
th{font-weight:600;color:var(--muted)}
.tbl-left th,.tbl-left td{text-align:left}
.tbl-left th:last-child,.tbl-left td:last-child{text-align:center;padding-left:6px;padding-right:6px}
.cut{display:block;max-width:min(44vw,190px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td:first-child .fxteam{max-width:min(44vw,190px)}
td:first-child .fxteam .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delwrap{background:none;border:0;padding:0;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.delc{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.xic{display:block;width:30px;height:30px;object-fit:contain}
td.pts{font-weight:800;font-size:16px}
.sortb{background:none;border:0;padding:6px 4px;min-height:40px;font-weight:600;color:var(--muted)}
.sortb.on{color:var(--ink)}
.rank{color:var(--muted);font-variant-numeric:tabular-nums;padding-right:4px}
.setline{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.setchip{font-family:var(--font-d);font-weight:700;font-size:22px;border:1px solid var(--line);border-radius:8px;padding:4px 12px}
.log{list-style:none;margin:8px 0 0;padding:0}
.log li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.log .t{font-variant-numeric:tabular-nums;color:var(--muted);min-width:46px}
.log .sc{margin-left:auto;font-weight:700;white-space:nowrap}
.btnrow{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.mrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.mrow .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.vh:focus-visible + label{outline:3px solid var(--gold);outline-offset:2px}
.bigstat{font-size:20px;margin:12px 0 4px}
.bigstat b{font-family:var(--font-d);font-size:56px;font-weight:800;margin-right:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 16px;max-width:320px}
.kv b{font-variant-numeric:tabular-nums;text-align:right}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Bande des sets dans l'en-tête */
.sets{flex:1 1 236px;max-width:340px;margin-left:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;min-width:0}
.scell{display:flex;flex-direction:column;align-items:center;line-height:1.1;border-left:1px solid rgba(255,255,255,.2);padding-left:2px}
.scl{font-size:11px;opacity:.75}
.scv{font-family:var(--font-d);font-weight:700;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.scv .w{color:var(--gold)}
.scv .l{opacity:.8}

/* Photos, boutons d'édition, menu */
.av{border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--line);vertical-align:middle}
.av.ph{display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);font-family:var(--font-d)}
.avbtn{background:none;border:0;padding:0;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.editc{width:30px;height:30px;border-radius:50%;background:#6B7B8C;color:#fff;display:flex;align-items:center;justify-content:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .editc{background:#51657A}}
:root[data-theme="dark"] .editc{background:#51657A}
.actcell{display:flex;align-items:center;justify-content:center;gap:0}
.pcell{display:flex;align-items:center;gap:10px}
details.card>summary{cursor:pointer;font-family:var(--font-d);font-weight:700;font-size:20px;min-height:44px;display:flex;align-items:center}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 12px 6px}
.brand .logo{background:transparent;padding:0}
.brand h1{font-size:32px;font-weight:800;line-height:1.05}
.brand p{margin:0;color:var(--muted);font-size:15px}
/* Menu : Match (rouge) à gauche, trois boutons à droite, Données (gris) dessous */
.menugrid2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,88px) 76px;gap:12px;padding:18px 12px 0;max-width:560px;margin:0 auto}
.mbtn{border:0;border-radius:16px;color:#fff;font-family:var(--font-d);font-weight:700;font-size:28px;line-height:1.05;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 6px;min-width:0}
.mbtn:active{filter:brightness(.9)}
.m-match{grid-column:1;grid-row:1 / span 3;background:#C62828;font-size:46px}
.m-clubs{grid-column:2;grid-row:1;background:#1D5FA8}
.m-champ{grid-column:2;grid-row:2;background:#2E7D32}
.m-cal{grid-column:2;grid-row:3;background:#6A3FA0}
.m-data{grid-column:1 / span 2;grid-row:4;background:#5A6B7C}
.menugrid{display:grid;grid-template-columns:1fr;gap:12px;padding:14px 12px 0;max-width:520px;margin:0 auto}
.menubtn{width:100%;min-height:84px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:12px 18px;text-align:left}
.menubtn b{font-family:var(--font-d);font-size:28px;font-weight:700;line-height:1.1}
.menubtn span{font-size:14px;color:var(--muted)}
.menubtn.live{border-color:var(--gold);border-width:2.5px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tot td{font-weight:800}
.statgrid div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;line-height:1.1}
.statgrid b{display:block;font-family:var(--font-d);font-size:28px;font-weight:800}
.statgrid span{font-size:12px;color:var(--muted)}

/* Chrono central et accueil */
.bigclock{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px 0}
.bigclock .clk{font-family:var(--font-d);font-weight:800;font-size:clamp(56px,18vw,80px);line-height:1;font-variant-numeric:tabular-nums}
.bigclock.paused .clk{opacity:.5}
.hbtn2{min-height:42px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:0 18px;font-weight:600}
.hbtn2:disabled{opacity:.4}
.bigbtn{width:100%;min-height:84px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--font-d);font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;gap:10px}
.bigbtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bigbtn:disabled{opacity:.45}
.ritem{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.ritem:last-child{border-bottom:0}
.ritem .fx{border-bottom:0;flex:1}
.fxt .nm{font-weight:600;overflow-wrap:anywhere}
.fxt small{opacity:1;color:var(--muted);font-weight:400}
.rsc{font-family:var(--font-d);font-weight:800;font-size:24px;white-space:nowrap}

/* Lien Sauvegarde et mention en bas du menu */
.menulink{display:flex;justify-content:flex-end;padding:6px 14px 0}
.linkbtn{background:none;border:0;padding:12px 4px;min-height:44px;font:inherit;font-size:16px;color:#1D5FA8;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .linkbtn{color:#7DB4F0}}
:root[data-theme="dark"] .linkbtn{color:#7DB4F0}
.menufoot{margin:0;padding:22px 12px 10px;text-align:center;color:var(--muted);font-style:italic;font-size:14px}

/* Calendrier */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;min-height:48px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.fx{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;min-height:64px}
.fx:last-child{border-bottom:0}
.fxd{display:flex;flex-direction:column;min-width:74px;font-weight:600;font-size:14px;line-height:1.2}
.fxt{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.fxteam{display:flex;align-items:center;gap:8px;min-width:0}
.fxteam .nm{flex:1;overflow-wrap:anywhere}
.fxteam b{font-family:var(--font-d);font-size:22px;min-width:20px;text-align:right}
.fxteam.win .nm{font-weight:700}
.tag.warn{color:var(--danger);border-color:var(--danger)}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:none;border:0;border-top:4px solid transparent;min-height:60px;font-weight:600;font-size:12.5px;color:var(--muted);padding:0 2px}
.nav button.on{border-top-color:var(--gold);color:var(--ink)}

/* Feuille de saisie */
#sheet .back{position:fixed;inset:0;z-index:40;background:rgba(5,12,20,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--surface);width:100%;max-width:720px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet .panel{animation:none}}
.group{margin-top:14px}
.group>p{margin:0 0 6px;font-weight:600;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

    lineup:emptyLineup(),

    clubs:[], champs:[], champAdded:null, fixtureRef:null, prepared:false, matchChamp:'', stage:'home', library:[], homeClub:'', agenda:[], swap:false, midSwap:false,

function migrate(s){
  var d = newState();
  s.clubs = s.clubs || []; s.champs = s.champs || [];
  s.champs.forEach(function(c){ c.fixtures = c.fixtures || []; });
  if(s.fixtureRef === undefined) s.fixtureRef = null;
  if(s.prepared === undefined) s.prepared = (s.events.length > 0 || s.sets.length > 0 || s.teams.some(function(t){ return t.players.length > 0; }));
  if(s.matchChamp === undefined) s.matchChamp = s.fixtureRef ? s.fixtureRef.cid : '';
  if(!s.library) s.library = [];
  if(!s.agenda) s.agenda = [];
  if(s.swap === undefined) s.swap = false;
  if(s.midSwap === undefined) s.midSwap = false;
  s.library.forEach(function(e){ if(e.swap === undefined) e.swap = false; if(e.midSwap === undefined) e.midSwap = false; });
  if(s.homeClub === undefined) s.homeClub = '';
  if(!s.stage) s.stage = s.prepared ? 'play' : 'home';
  s.prefs = Object.assign({}, d.prefs, s.prefs || {});
  s.teams.forEach(function(t){ if(t.clubId == null) t.clubId = ''; });
  if(!s.lineup){
    s.lineup = s.teams.map(function(t){
      var on = t.players.filter(function(p){ return p.on; }).slice(0,6).map(function(p){ return p.id; });
      while(on.length < 6) on.push(null);
      return on;
    });
    s.history = [];
  }
  s.v = 2;
  return s;
}

}

/* ---------- Navigation : bouton « précédent » du téléphone ---------- */
/* Dans un onglet, on a poussé une entrée d'historique : « précédent » la retire et renvoie au menu (match en pause).
   Sur le menu, il n'y a plus d'entrée à retirer : « précédent » quitte alors l'application. */
var histDepth = 0, ignorePop = false;
function pauseMatchClock(){ if(S.clock.running){ stopClock(); save(); } }
function setTab(t){
  var from = ui.tab;
  if(t === from) return;
  if(t === 'menu'){
    ui.tab = 'menu'; ui.sheet = null; ui.showSetup = false;
    pauseMatchClock();
    if(histDepth > 0){
      histDepth = 0; ignorePop = true;
      setTimeout(function(){ ignorePop = false; }, 600);
      try{ history.back(); }catch(e){ ignorePop = false; }
    }
    return;
  }
  if(from === 'menu' && histDepth === 0){
    try{ history.pushState({ v:'tab' }, ''); histDepth = 1; }catch(e){}
  }
  ui.tab = t;
}
function onPop(){
  if(ignorePop){ ignorePop = false; return; }
  if(histDepth > 0 && ui.tab !== 'menu'){
    if(ui.sheet){                       /* une fenêtre est ouverte : on la ferme d'abord */
      ui.sheet = null;
      try{ history.pushState({ v:'tab' }, ''); }catch(e){ histDepth = 0; }
      render(); return;
    }
    histDepth = 0; ui.tab = 'menu'; ui.showSetup = false; ui.resume = false;
    pauseMatchClock();
    render(); window.scrollTo(0,0);
  }
}

/* ---------- Rotation ---------- */
/* lineup[t][0..5] = postes 1..6 ; rotation dans le sens horaire : 2→1, 1→6, 6→5, 5→4, 4→3, 3→2 */
function rotate(t, dir){
  var L = S.lineup[t];
  S.lineup[t] = dir > 0 ? L.slice(1).concat(L[0]) : [L[5]].concat(L.slice(0,5));
}
function isDecisive(){ return S.sets.length === 2 * S.cfg.setsToWin - 2; }
/* Bouton « inverser » : au début du 1er set et du set décisif, tant que le service n'est pas donné */
function showSwap(){ return S.stage === 'play' && !S.finished && S.serving === null && S.cur[0] + S.cur[1] === 0 && (S.sets.length === 0 || isDecisive()); }
function scoreFor(team){
  if(S.serving !== null && S.serving !== team) rotate(team, 1);
  S.cur[team]++; S.serving = team;
  /* set décisif : changement de côté une seule fois, dès qu'une équipe atteint 8 points */
  if(isDecisive() && !S.midSwap && Math.max(S.cur[0], S.cur[1]) >= 8){
    S.swap = !S.swap; S.midSwap = true;
    ui.msg = 'Changement de côté à 8 points : la saisie des scores est inversée.';
  }
}

/* ---------- Historique (annuler) ---------- */
function snap(){
  S.history.push({ ev:S.events.length, cur:S.cur.slice(), sets:S.sets.map(function(x){ return x.slice(); }),
    serving:S.serving, timeouts:S.timeouts.slice(), subs:S.subs.slice(), finished:S.finished,
    lineup:S.lineup.map(function(a){ return a.slice(); }), swap:S.swap, midSwap:S.midSwap });
  if(S.history.length > 80) S.history.shift();
}
function undo(){
  var h = S.history.pop();
  if(!h) return;
  S.events.length = h.ev;
  S.cur = h.cur; S.sets = h.sets; S.serving = h.serving; S.timeouts = h.timeouts; S.subs = h.subs; S.finished = h.finished; S.lineup = h.lineup;
  if(h.swap !== undefined){ S.swap = h.swap; S.midSwap = h.midSwap; }
  S.tc = null; ui.sheet = null;
  save(); render();
}
function addEvent(e){
  var base = { n:S.events.length + 1, set:setNumber(), t:clockMs(), ts:new Date().toISOString(), score:S.cur.slice() };
  S.events.push(Object.assign(base, e));
}

/* ---------- Chrono ---------- */
var wl = null;
function keepAwake(){
  try{
    if('wakeLock' in navigator && !wl){
      navigator.wakeLock.request('screen').then(function(l){ wl = l; l.addEventListener('release', function(){ wl = null; }); }).catch(function(){});
    }
  }catch(e){}
}
function startClock(){ S.clock.since = Date.now(); S.clock.running = true; keepAwake(); }
function stopClock(){ if(S.clock.running){ S.clock.acc += Date.now() - S.clock.since; S.clock.running = false; } }
function toggleClock(){ if(S.clock.running) stopClock(); else startClock(); save(); render(); }
function autoClock(){ if(!S.clock.running && S.clock.acc === 0 && S.events.length === 0) startClock(); }

/* ---------- Actions de match ---------- */
function commitPoint(team, how, pid){
  ui.msg = ''; snap(); autoClock();
  scoreFor(team);
  addEvent(Object.assign({ type:'point', team:team, how:how }, pinfo(findPlayer(team, pid))));
  afterPoint();
}
function commitFault(team, kind, pid){
  ui.msg = ''; snap(); autoClock();
  scoreFor(1 - team);
  addEvent(Object.assign({ type:'fault', team:team, how:kind, pointFor:1 - team }, pinfo(findPlayer(team, pid))));
  afterPoint();
}
function afterPoint(){
  save();
  var w = setWinner();
  ui.sheet = w !== null ? { kind:'setend', winner:w } : null;
  render();
}
function commitSub(team, outId, inId){
  var L = S.lineup[team], idx = L.indexOf(outId), o = findPlayer(team, outId), i = findPlayer(team, inId);
  if(idx < 0 || !o || !i) return;
  snap();
  L[idx] = inId; S.subs[team]++;
  addEvent(Object.assign({ type:'sub', team:team, how:'entre ' + plabel(i.num, i.name) }, pinfo(o)));
  save();
}
function callTimeout(team){
  if(S.timeouts[team] >= 2 || S.finished) return;
  snap(); S.timeouts[team]++;
  addEvent({ type:'timeout', team:team });
  S.tc = { team:team, endsAt:Date.now() + 30000 };
  save(); render();
}
function manualRotate(t, dir){
  snap(); rotate(t, dir); save(); render();
}
function endSet(){
  snap();

  addEvent({ type:'setEnd', how:a + '-' + b });
  S.sets.push([a,b]);
  S.cur = [0,0]; S.timeouts = [0,0]; S.subs = [0,0]; S.serving = null; S.tc = null;
  var w = setsWon();
  ui.sheet = null; S.midSwap = false;
  if(!(w[0] >= S.cfg.setsToWin || w[1] >= S.cfg.setsToWin)){
    S.swap = !S.swap;
    ui.msg = 'Changement de côté : la saisie des scores est inversée.';
  }
  if(w[0] >= S.cfg.setsToWin || w[1] >= S.cfg.setsToWin){
    S.finished = true;
    addEvent({ type:'matchEnd', set:S.sets.length, how:w[0] + '-' + w[1], score:[a,b] });
    stopClock();
    var fr = S.fixtureRef, ae = (fr && !fr.cid) ? calEntry('', fr.fid) : null;
    if(ae && ae.kind === 'amical'){
      ae.f.result = { hs:w[0], as:w[1], sets:S.sets.map(function(x){ return x.slice(); }), source:'live', ref:S.created };
      ui.msg = 'Résultat ajouté au calendrier.';
    } else {
      var fch = fr && champById(fr.cid), ff = fch && fixtureOf(fch, fr.fid), done = null;
      if(ff) done = addToChamp(fr.cid, ff.home, ff.away, ff.id);
      else if(champById(S.matchChamp)){
        var mch = champById(S.matchChamp), k0 = S.teams[0].clubId, k1 = S.teams[1].clubId;
        if(k0 && k1 && k0 !== k1 && mch.clubIds.indexOf(k0) >= 0 && mch.clubIds.indexOf(k1) >= 0) done = addToChamp(mch.id, k0, k1);
        else ui.sheet = champSheet(mch.id);
      }
      if(done) ui.msg = ff ? 'Résultat ajouté au calendrier de ' + fch.name + '.' : 'Résultat ajouté à ' + champById(S.matchChamp).name + '.';
      else if(!ui.sheet && S.champs.length) ui.sheet = champSheet(null);
    }
  }
  save(); render();
}
/* ---------- Bibliothèque de matchs (nouveau / reprendre) ---------- */
var MATCH_KEYS = ['created','title','teams','lineup','cfg','sets','cur','serving','timeouts','subs','events','history','finished','clock','tc','fixtureRef','matchChamp','prepared','champAdded','swap','midSwap'];
function hasContent(){ return S.events.length > 0 || S.sets.length > 0; }
function matchSnapshot(){
  var o = {};
  MATCH_KEYS.forEach(function(k){ o[k] = JSON.parse(JSON.stringify(S[k] === undefined ? null : S[k])); });
  o.clock = { running:false, since:0, acc:clockMs() };
  o.tc = null;
  o.savedAt = new Date().toISOString();
  return o;
}
function archiveCurrent(){
  if(!hasContent()) return;
  S.library = S.library.filter(function(x){ return x.created !== S.created; });
  S.library.unshift(matchSnapshot());
  if(S.library.length > 40) S.library.length = 40;
}
function loadMatch(created){
  var e = S.library.filter(function(x){ return x.created === created; })[0];
  if(!e) return false;
  stopClock(); archiveCurrent();
  S.library = S.library.filter(function(x){ return x.created !== created; });
  MATCH_KEYS.forEach(function(k){ S[k] = JSON.parse(JSON.stringify(e[k])); });
  S.clock = { running:false, since:0, acc:(e.clock && e.clock.acc) || 0 };
  S.tc = null; S.prepared = true; S.stage = 'play';
  return true;
}
function resetForNew(){

    clubs:S.clubs, champs:S.champs, prefs:S.prefs, library:S.library, homeClub:S.homeClub, agenda:S.agenda };

/* ---------- Statistiques ---------- */
function tnOf(m, i){ return ((m.teams[i].name || '').trim()) || (i ? 'Équipe B' : 'Équipe A'); }
function setsWonOf(m){ var w = [0,0]; (m.sets || []).forEach(function(s){ if(s[0] > s[1]) w[0]++; else w[1]++; }); return w; }
function statsRowsOf(m){
  var map = {};
  function get(e){
    var k = e.team + '|' + (e.pid || 'none');
    return map[k] || (map[k] = { team:e.team, pid:e.pid || null, num:e.num, name:e.name || 'Non attribué', pts:0, attack:0, block:0, ace:0, relance:0, faults:0 });
  }
  m.events.forEach(function(e){
    if(e.type === 'point'){ var r = get(e); r.pts++; if(r[e.how] != null) r[e.how]++; }
    else if(e.type === 'fault'){ get(e).faults++; }
  });

}
function statsRows(){ return statsRowsOf(S); }

  var r = { pts:0, attack:0, block:0, ace:0, relance:0, faults:0 };
  m.events.forEach(function(e){
    if(e.pid !== pid) return;
    if(e.type === 'point'){ r.pts++; if(r[e.how] != null) r[e.how]++; }
    else if(e.type === 'fault') r.faults++;

  return r;
}
function playerStat(pid){ return playerStatOf(S, pid); }
function evTextOf(m, e){
  var who = plabel(e.num, e.name);
  switch(e.type){

    case 'fault': return 'Faute ' + tnOf(m, e.team) + ' · ' + e.how + (who ? ' · ' + who : '');
    case 'sub': return 'Remplacement ' + tnOf(m, e.team) + ' · sort ' + (who || '?') + ' · ' + e.how;
    case 'timeout': return 'Temps mort ' + tnOf(m, e.team);
    case 'setEnd': return 'Fin du set ' + e.set + ' · ' + e.how.replace('-', ' – ');

/* ---------- Photos et avatars ---------- */
function readPhoto(file, cb){
  var fr = new FileReader();
  fr.onerror = function(){ ui.msg = 'Impossible de lire cette image.'; render(); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ ui.msg = 'Ce fichier n\'est pas une image lisible.'; render(); };
    img.onload = function(){
      var w = img.naturalWidth || img.width || 160, h = img.naturalHeight || img.height || 160, s = Math.min(w, h), out = 160;
      var cv = document.createElement('canvas'); cv.width = out; cv.height = out;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, out, out);
      ctx.drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, out, out);
      cb(cv.toDataURL('image/jpeg', 0.82));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function findMember(mid){

var GEAR = (function(){

function known(own, opp){ return (own === 3 && opp <= 2) || (opp === 3 && own <= 2); }

  if(opp === 3) return own === 2 ? 2 : (own === 1 ? 1 : 0);

}
function standings(ch){
  var rows = {};
  ch.clubIds.forEach(function(id){ rows[id] = { id:id, name:clubName(id), j:0, g:0, p:0, sp:0, sc:0, pts:0 }; });
  ch.matches.forEach(function(m){
    var h = rows[m.home], a = rows[m.away];
    if(!h || !a) return;
    h.j++; a.j++;
    h.sp += m.hs; h.sc += m.as; a.sp += m.as; a.sc += m.hs;
    if(m.hs > m.as){ h.g++; a.p++; } else { a.g++; h.p++; }
    h.pts += ptsFor(m.hs, m.as); a.pts += ptsFor(m.as, m.hs);

  var list = Object.keys(rows).map(function(k){ return rows[k]; });
  list.sort(function(x,y){ return (y.pts - x.pts) || ((y.sp - y.sc) - (x.sp - x.sc)) || (y.sp - x.sp) || x.name.localeCompare(y.name, 'fr'); });

/* ---------- Calendrier ---------- */
function iso(y, mo, d){

}

}
function parseTime(s){

}
function toDate(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function isoOf(dt){ return iso(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()); }

}

/* ---------- Clubs et import CSV ---------- */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  var first = (text.split(/\r?\n/).filter(function(l){ return l.trim(); })[0]) || '';
  var d = ';', best = -1;
  [';', ',', '\t'].forEach(function(c){ var n = first.split(c).length - 1; if(n > best){ best = n; d = c; } });
  var rows = [], row = [], cur = '', inQ = false;
  for(var i = 0; i < text.length; i++){
    var ch = text[i];
    if(inQ){
      if(ch === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else if(ch === '"') inQ = true;
    else if(ch === d){ row.push(cur); cur = ''; }
    else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i+1] === '\n') i++;
      row.push(cur); cur = '';
      if(row.some(function(c){ return c.trim() !== ''; })) rows.push(row);
      row = [];
    } else cur += ch;
  }
  row.push(cur);
  if(row.some(function(c){ return c.trim() !== ''; })) rows.push(row);
  return rows;
}
function colKey(h){
  var n = norm(h);

  if(n === 'age' || n.indexOf('age') === 0) return 'age';
  return null;
}
function importRows(rows){

  var map = ['licence','nom','prenom','age'], start = 0;
  var head = rows[0].map(colKey);
  if(head.filter(Boolean).length >= 2){ map = head; start = 1; }
  var added = 0, updated = 0;
  for(var i = start; i < rows.length; i++){
    var m = { licence:'', nom:'', prenom:'', age:'' };
    rows[i].forEach(function(cell, j){ var k = map[j]; if(k) m[k] = cell.trim(); });
    if(!m.nom && !m.prenom && !m.licence) continue;
    var age = parseInt(m.age, 10);
    m.age = isNaN(age) ? '' : age;
    var ex = m.licence ? club.members.filter(function(x){ return x.licence === m.licence; })[0] : null;
    if(ex){ ex.nom = m.nom; ex.prenom = m.prenom; ex.age = m.age; updated++; }
    else { club.members.push({ id:uid(), licence:m.licence, nom:m.nom, prenom:m.prenom, age:m.age }); added++; }
  }
  ui.msg = added + ' membre' + (added > 1 ? 's' : '') + ' ajouté' + (added > 1 ? 's' : '') + (updated ? ', ' + updated + ' mis à jour' : '') + ' dans ' + club.name + '.';
  save(); render();
  return added + updated;
}

/* Terrain vu de dessus : l'équipe A en haut, l'équipe B en bas, filet au milieu.

function findHtml(t){
  var club = clubById(S.teams[t].clubId);
  if(!club) return '<p class="muted">Choisissez un club ci-dessus pour retrouver ses membres.</p>';
  var qn = norm(ui.find[t]);
  var have = {};
  S.teams[t].players.forEach(function(p){ if(p.mid) have[p.mid] = true; });
  var list = club.members.filter(function(m){
    if(have[m.id]) return false;
    return !qn || norm(m.nom + m.prenom).indexOf(qn) >= 0 || norm(m.prenom + m.nom).indexOf(qn) >= 0 || norm(m.licence).indexOf(qn) >= 0;
  }).sort(function(a,b){ return (a.nom || '').localeCompare(b.nom || '', 'fr'); });
  if(!club.members.length) return '<p class="muted">Ce club n\'a pas encore de membres. Ajoutez-en dans l\'onglet Clubs.</p>';
  if(!list.length) return '<p class="muted">Aucun membre trouvé.</p>';
  var shown = list.slice(0, 8).map(function(m){
    return '<button class="btn" data-act="pickMember" data-team="' + t + '" data-mid="' + m.id + '"><span>' + esc(memberName(m)) + '</span><small>' + esc([m.licence, m.age !== '' ? m.age + ' ans' : ''].filter(Boolean).join(' · ')) + '</small></button>';
  }).join('');

}

  });
  return v + 'V – ' + d + 'D';
}

  }
  var own = ['setend','endask','newmatch','delclub','delchamp','champ','delmember','dellib','editmember','restore'];
  var closeBtn = own.indexOf(sh.kind) >= 0 ? '' : '<button class="btn wide close" data-act="closeSheet">Fermer</button>';
  return '<div class="back" data-act="backdrop"><div class="panel" role="dialog" aria-modal="true">' + inner + closeBtn + '</div></div>';
}

function render(){
  var main = ui.tab === 'menu' ? menuView() : (ui.tab === 'match' ? (S.stage === 'home' ? homeView() : (inSetup() ? setupView() : matchView())) : (ui.tab === 'clubs' ? clubsView() : (ui.tab === 'champ' ? champView() : (ui.tab === 'cal' ? calendarView() : (ui.tab === 'backup' ? backupView() : dataView())))));
  var warn = ui.warn ? '<div class="banner" role="alert">' + esc(ui.warn) + '</div>' : '';
  document.getElementById('app').innerHTML = header() + '<main>' + warn + main + (ui.tab === 'menu' ? '' : menuBtn()) + '</main>';
  document.getElementById('sheet').innerHTML = ui.sheet ? sheetView() : '';
  if(ui.focus){ var el = document.getElementById(ui.focus); if(el) el.focus(); ui.focus = null; }
}

/* ---------- Interactions ---------- */
function tryCommit(){
  var sh = ui.sheet;
  if(!sh) return;
  if(sh.kind === 'point' && sh.how !== undefined && sh.pid !== undefined){
    commitPoint(sh.team, sh.how, sh.pid || null);
  } else if(sh.kind === 'fault' && sh.how !== undefined && sh.pid !== undefined){
    commitFault(sh.team, sh.how, sh.pid || null);
  } else if(sh.kind === 'sub' && sh.out !== undefined && sh.in !== undefined){
    commitSub(sh.team, sh.out, sh.in);
    ui.sheet = null; render();
  } else {
    render();
  }
}
function placeNew(t, p){
  S.teams[t].players.push(p);
  var i = S.lineup[t].indexOf(null);
  if(i >= 0) S.lineup[t][i] = p.id;
  save();
}
function addPlayer(t){
  var n = document.getElementById('newnum' + t), m = document.getElementById('newname' + t);
  var num = n.value.trim(), name = m.value.trim();
  if(!num && !name){ n.focus(); return; }
  placeNew(t, { id:uid(), num:num, name:name, licence:'', mid:'' });
  ui.focus = 'newnum' + t; render();
}
function createClub(){
  var nc = ui.newClub, name = (nc.name || '').trim();
  if(!name){ ui.msg = 'Saisissez le nom du club.'; render(); return; }
  if(S.clubs.some(function(c){ return norm(c.name) === norm(name); })){ ui.msg = 'Un club porte déjà ce nom.'; render(); return; }
  var c = { id:uid(), name:name, members:[] };
  if(nc.logo) c.logo = nc.logo;
  S.clubs.push(c); ui.clubSel = c.id; ui.createdId = c.id; ui.clubView = 'created'; ui.newClub = { name:'', logo:'' }; ui.msg = '';
  save(); render(); window.scrollTo(0,0);
}
function saveEvent(){
  var ev = ui.ev, date = parseDate(ev.date), time = parseTime(ev.time), place = (ev.place || '').trim();
  if(!date){ ui.msg = 'Choisissez une date.'; render(); return; }
  if(ev.kind === 'event'){
    var title = (ev.title || '').trim();
    if(!title){ ui.msg = 'Saisissez un titre.'; render(); return; }
    S.agenda.push({ id:uid(), kind:'event', title:title, date:date, time:time, place:place });
    ui.msg = 'Événement « ' + title + ' » créé.';
  } else {
    if(!ev.home || !ev.away){ ui.msg = 'Choisissez les deux clubs.'; render(); return; }
    if(ev.home === ev.away){ ui.msg = 'Choisissez deux clubs différents.'; render(); return; }
    var ch = champById(ev.target);
    if(ch){
      ch.fixtures.push({ id:uid(), date:date, time:time, place:place, home:ev.home, away:ev.away, matchId:null });
      ui.msg = 'Match créé dans ' + ch.name + '.';
    } else {
      S.agenda.push({ id:uid(), kind:'match', date:date, time:time, place:place, home:ev.home, away:ev.away, result:null });
      ui.msg = 'Match amical créé.';
    }
  }
  save(); ui.calView = 'list'; ui.ev = null; render(); window.scrollTo(0,0);
}
function addMember(){
  var c = curClub();
  if(!c) return;
  var lic = document.getElementById('mlic').value.trim(), nom = document.getElementById('mnom').value.trim(), pre = document.getElementById('mpre').value.trim();
  var age = parseInt(document.getElementById('mage').value, 10);
  if(!nom && !pre){ document.getElementById('mnom').focus(); return; }
  c.members.push({ id:uid(), licence:lic, nom:nom, prenom:pre, age:isNaN(age) ? '' : age });
  ui.msg = ''; save(); ui.focus = 'mlic'; render();
}
function addChamp(){
  var el = document.getElementById('newchamp'), name = el.value.trim();
  if(!name){ el.focus(); return; }
  var c = { id:uid(), name:name, clubIds:[], matches:[], fixtures:[] };
  S.champs.push(c); ui.champSel = c.id; ui.msg = '';
  save(); render();
}
function addMatch(){
  var ch = curChamp();
  if(!ch) return;
  var h = document.getElementById('mhome').value, a = document.getElementById('maway').value, r = document.getElementById('mres').value.split('-');
  if(h === a){ ui.msg = 'Choisissez deux clubs différents.'; render(); return; }
  ch.matches.push({ id:uid(), ref:null, home:h, away:a, hs:parseInt(r[0],10), as:parseInt(r[1],10), sets:null, source:'manual', date:stamp() });
  ui.msg = ''; save(); render();
}

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  var act = b.dataset.act, d = b.dataset, t = parseInt(d.team, 10), sh = ui.sheet;
  if(act === 'backdrop'){ if(e.target !== b) return; ui.sheet = null; render(); return; }
  switch(act){
    case 'tab':
      setTab(d.tab); ui.showSetup = false; ui.sheet = null; ui.msg = '';
      if(d.tab === 'clubs') ui.clubView = 'home';
      if(d.tab === 'cal'){ ui.calView = 'list'; ui.ev = null; }
      render(); window.scrollTo(0,0); break;
    case 'dataTeams': ui.dataView = 'teams'; ui.dataTeam = null; render(); window.scrollTo(0,0); break;
    case 'dataPlayers': ui.dataView = 'players'; ui.dataPlayer = null; ui.pfilter = ''; render(); window.scrollTo(0,0); break;
    case 'dataTeamSel': ui.dataTeam = d.key; render(); window.scrollTo(0,0); break;
    case 'dataPlayerSel': ui.dataPlayer = d.key; render(); window.scrollTo(0,0); break;
    case 'dataMatchOpen': ui.dataMatch = d.mid; ui.dataFrom = d.from; ui.dataView = 'match'; render(); window.scrollTo(0,0); break;
    case 'dataBack':

      else if(ui.dataView === 'teams'){ if(ui.dataTeam) ui.dataTeam = null; else ui.dataView = 'home'; }
      else if(ui.dataView === 'players'){ if(ui.dataPlayer) ui.dataPlayer = null; else ui.dataView = 'home'; }
      render(); window.scrollTo(0,0); break;
    case 'editMember': {
      var fm = findMember(d.mid);
      if(fm){ ui.sheet = { kind:'editmember', mid:d.mid, err:'', draft:{ licence:fm.m.licence || '', nom:fm.m.nom || '', prenom:fm.m.prenom || '', age:fm.m.age === '' || fm.m.age == null ? '' : String(fm.m.age), photo:fm.m.photo || '' } }; render(); }
      break;
    }
    case 'memPhotoDel': sh.draft.photo = ''; render(); break;
    case 'memSave': {
      var ef = findMember(sh.mid), dr2 = sh.draft;
      if(!ef){ ui.sheet = null; render(); break; }
      if(!(dr2.nom || '').trim() && !(dr2.prenom || '').trim()){ sh.err = 'Saisissez au moins un nom ou un prénom.'; render(); break; }
      var ag = parseInt(dr2.age, 10);
      ef.m.licence = (dr2.licence || '').trim(); ef.m.nom = (dr2.nom || '').trim(); ef.m.prenom = (dr2.prenom || '').trim(); ef.m.age = isNaN(ag) ? '' : ag;
      if(dr2.photo) ef.m.photo = dr2.photo; else delete ef.m.photo;
      var nm2 = memberName(ef.m);
      function upd(p){ if(p.mid === ef.m.id){ p.name = nm2; p.licence = ef.m.licence; } }
      S.teams.forEach(function(tm){ tm.players.forEach(upd); });
      S.clubs.forEach(function(cl){ if(cl.squad && cl.squad.players) cl.squad.players.forEach(upd); });
      ui.sheet = null; save(); render(); break;
    }
    case 'pickPhoto': {
      ui.photoTarget = { t:t, pid:d.pid };
      var pin = document.getElementById('pphoto');
      if(pin && pin.click) pin.click();
      break;
    }
    case 'restoreOk': if(ui.pendingRestore){ applyBackup(ui.pendingRestore); ui.pendingRestore = null; ui.sheet = null; ui.msg = 'Sauvegarde restaurée.'; ui.dataView = 'home'; render(); window.scrollTo(0,0); } break;
    case 'restoreNo': ui.pendingRestore = null; ui.sheet = null; render(); break;
    case 'openSetup': ui.showSetup = true; ui.msg = ''; render(); window.scrollTo(0,0); break;
    case 'startMatch': S.prepared = true; S.stage = 'play'; ui.showSetup = false; ui.msg = ''; save(); render(); window.scrollTo(0,0); break;
    case 'newPlay': newMatch(); break;
    case 'showResume': ui.resume = true; render(); window.scrollTo(0,0); break;
    case 'hideResume': ui.resume = false; render(); break;
    case 'goHome': stopClock(); S.stage = 'home'; ui.resume = false; ui.showSetup = false; ui.sheet = null; save(); render(); window.scrollTo(0,0); break;
    case 'resumeMatch':
      if(d.mid === S.created && hasContent()){ S.stage = 'play'; S.prepared = true; }
      else if(!loadMatch(d.mid)) break;
      ui.resume = false; ui.showSetup = false; ui.sheet = null; ui.msg = '';
      save(); render(); window.scrollTo(0,0); break;
    case 'delLibAsk': ui.sheet = { kind:'dellib', mid:d.mid }; render(); break;
    case 'delLibOk':
      S.library = S.library.filter(function(x){ return x.created !== sh.mid; });
      if(!savedMatches().length) ui.resume = false;
      ui.sheet = null; save(); render(); break;
    case 'clock': toggleClock(); break;
    case 'swap': S.swap = !S.swap; save(); render(); break;
    case 'serve':
      S.serving = (S.serving === t ? null : t);
      if(S.serving !== null && !S.clock.running && !S.finished) startClock();
      save(); render(); break;
    case 'pref': S.prefs[d.k] = !S.prefs[d.k]; save(); render(); break;
    case 'rot': manualRotate(t, parseInt(d.dir, 10)); break;
    case 'openPoint': ui.sheet = { kind:'point', team:t }; render(); break;
    case 'openFault': ui.sheet = { kind:'fault', team:t }; render(); break;
    case 'openSub': ui.sheet = { kind:'sub', team:t }; render(); break;
    case 'openPlayer': ui.sheet = { kind:'player', team:t, pid:d.pid }; render(); break;
    case 'openLineup': ui.sheet = { kind:'lineup', team:t }; render(); break;
    case 'openChamp': ui.sheet = champSheet(S.matchChamp); render(); break;
    case 'timeout': callTimeout(t); break;
    case 'tcStop': S.tc = null; save(); render(); break;
    case 'undo': undo(); break;
    case 'endSetAsk': ui.sheet = { kind:'endask' }; render(); break;
    case 'endSetOk': endSet(); break;
    case 'closeSheet': ui.sheet = null; render(); break;
    case 'pickHow':
      if(d.how === 'oppfault' && sh.kind === 'point'){ ui.sheet = { kind:'fault', team:1 - sh.team }; render(); }
      else { sh.how = d.how; tryCommit(); }
      break;
    case 'pickWho': sh.pid = d.pid; tryCommit(); break;
    case 'pickOut': sh.out = d.pid; tryCommit(); break;
    case 'pickIn': sh.in = d.pid; tryCommit(); break;
    case 'delP':
      S.teams[t].players = S.teams[t].players.filter(function(x){ return x.id !== d.pid; });
      S.lineup[t] = S.lineup[t].map(function(id){ return id === d.pid ? null : id; });
      save(); render(); break;
    case 'addP': addPlayer(t); break;
    case 'pickMember': {
      var club = clubById(S.teams[t].clubId);
      var m = club && club.members.filter(function(x){ return x.id === d.mid; })[0];
      if(!m) break;
      var num = document.getElementById('newnum' + t).value.trim();
      placeNew(t, { id:uid(), num:num, name:memberName(m), licence:m.licence, mid:m.id });
      /* pas de clavier : on ne redonne pas le focus au champ de recherche, et on ferme celui qui serait resté ouvert */
      ui.find[t] = ''; ui.focus = null;
      try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch(err){}
      render();
      break;
    }
    case 'share': doShare(matchById(d.mid)); break;
    case 'nativeShare':
      try{ navigator.share({ text:sh.text }).catch(function(){}); }catch(err){}
      break;
    case 'copy': copyText(sh.text); break;
    case 'exportCsv': doExport('csv', matchById(d.mid)); break;
    case 'exportJson': doExport('json', matchById(d.mid)); break;
    case 'backup': doBackup(); break;
    case 'newMatchAsk': ui.sheet = { kind:'newmatch' }; render(); break;
    case 'newMatchOk': newMatch(); break;
    case 'pickChamp': ui.sheet = champSheet(d.cid); render(); break;
    case 'champOk':
      if(addToChamp(sh.cid, sh.c0, sh.c1)){
        var cn = champById(sh.cid).name;
        ui.champSel = sh.cid; setTab('champ'); ui.sheet = null; ui.msg = 'Match ajouté à ' + cn + '.';
        render(); window.scrollTo(0,0);
      }
      break;
    case 'importText': {
      var txt = document.getElementById('csvtext').value;
      if(!txt.trim()){ ui.msg = 'Collez d\'abord le contenu du fichier.'; render(); break; }
      importText(txt); break;
    }
    case 'addMember': addMember(); break;
    case 'delMemberAsk': ui.sheet = { kind:'delmember', mid:d.mid }; render(); break;
    case 'delMemberOk': {
      var c = curClub();
      if(c){ c.members = c.members.filter(function(x){ return x.id !== sh.mid; }); }
      ui.sheet = null; save(); render();
      break;
    }
    case 'delClubAsk': ui.sheet = { kind:'delclub' }; render(); break;
    case 'delClubOk': {
      var dc = curClub();
      if(dc){
        S.clubs = S.clubs.filter(function(x){ return x.id !== dc.id; });
        S.champs.forEach(function(ch2){
          ch2.clubIds = ch2.clubIds.filter(function(id){ return id !== dc.id; });
          ch2.matches = ch2.matches.filter(function(m2){ return m2.home !== dc.id && m2.away !== dc.id; });
          ch2.fixtures = ch2.fixtures.filter(function(f2){ return f2.home !== dc.id && f2.away !== dc.id; });
        });
        S.teams.forEach(function(tm){ if(tm.clubId === dc.id) tm.clubId = ''; });
        S.agenda = S.agenda.filter(function(a2){ return a2.kind === 'event' || (a2.home !== dc.id && a2.away !== dc.id); });
        ui.clubSel = null;
      }
      ui.clubView = 'list'; ui.sheet = null; save(); render(); break;
    }
    case 'addChamp': addChamp(); break;
    case 'toggleChampClub': {
      var ch3 = curChamp();
      if(!ch3) break;
      var ix = ch3.clubIds.indexOf(d.cid);
      if(ix >= 0) ch3.clubIds.splice(ix, 1); else ch3.clubIds.push(d.cid);
      save(); render(); break;
    }
    case 'sort':
      if(ui.sort.k === d.k) ui.sort.dir = -ui.sort.dir; else ui.sort = { k:d.k, dir:d.k === 'club' ? 1 : -1 };
      render(); break;
    case 'addMatch': addMatch(); break;
    case 'delMatch': {
      var ch4 = curChamp();
      if(ch4){
        ch4.matches = ch4.matches.filter(function(x){ return x.id !== d.mid; });
        ch4.fixtures.forEach(function(f){ if(f.matchId === d.mid) f.matchId = null; });
        save(); render();
      }
      break;
    }
    case 'delChampAsk': ui.sheet = { kind:'delchamp' }; render(); break;
    case 'calHide': ui.calHideDone = !ui.calHideDone; render(); break;
    case 'logoDel': { var lc = curClub(); if(lc){ delete lc.logo; ui.msg = ''; save(); render(); } break; }
    case 'openFixture': ui.sheet = { kind:'fixture', cid:d.cid || '', fid:d.fid }; render(); break;
    case 'playFixture': startFixture(sh.cid, sh.fid); break;
    case 'fixRes': {
      var re1 = calEntry(sh.cid, sh.fid);
      if(re1) setEntryResult(re1, document.getElementById('fres').value);
      ui.sheet = null; render(); break;
    }
    case 'fixClear': {
      var re2 = calEntry(sh.cid, sh.fid);
      if(re2) clearEntryResult(re2);
      ui.sheet = null; render(); break;
    }
    case 'fixDel': {
      var re3 = calEntry(sh.cid, sh.fid);
      if(re3) deleteEntry(re3);
      ui.sheet = null; render(); break;
    }
    case 'calCreate': ui.calView = 'create'; ui.ev = { kind:'match', title:'', date:isoOf(new Date()), time:'', place:'', target:'', home:'', away:'' }; ui.msg = ''; render(); window.scrollTo(0,0); break;
    case 'calBack': ui.calView = 'list'; ui.ev = null; ui.msg = ''; render(); window.scrollTo(0,0); break;
    case 'evKind': ui.ev.kind = d.k; ui.msg = ''; render(); break;
    case 'evTarget': ui.ev.target = d.t === 'amical' ? '' : d.t; ui.ev.home = ''; ui.ev.away = ''; ui.msg = ''; render(); break;
    case 'evSave': saveEvent(); break;
    case 'clubsGo':
      ui.clubView = d.v; ui.msg = '';
      if(d.v === 'create') ui.newClub = { name:'', logo:'' };
      render(); window.scrollTo(0,0); break;
    case 'clubEdit': ui.clubSel = d.cid; ui.clubView = 'edit'; ui.msg = ''; render(); window.scrollTo(0,0); break;
    case 'ncLogoDel': ui.newClub.logo = ''; render(); break;
    case 'clubCreate': createClub(); break;
    case 'delChampOk': {
      var dch = curChamp();
      if(dch) S.champs = S.champs.filter(function(x){ return x.id !== dch.id; });
      ui.champSel = null; ui.sheet = null; save(); render(); break;
    }
  }
});

document.addEventListener('input', function(e){
  var ds = e.target.dataset || {};
  if(ds.find != null){
    var ft = parseInt(ds.find, 10);
    ui.find[ft] = e.target.value;
    var res = document.getElementById('res' + ft);
    if(res) res.innerHTML = findHtml(ft);
    return;
  }
  if(ds.pfind != null){
    ui.pfilter = e.target.value;
    var pl = document.getElementById('plist');
    if(pl) pl.innerHTML = playerListHtml(playerIndex());
    return;
  }
  var bind = ds.bind;
  if(!bind) return;
  var v = e.target.value, t = parseInt(ds.team, 10);
  if(bind === 'tname') S.teams[t].name = v;
  else if(bind === 'title') S.title = v;
  else if(bind === 'sets') S.cfg.setsToWin = parseInt(v, 10) === 2 ? 2 : 3;
  else if(bind === 'pts') S.cfg.pts = Math.max(1, parseInt(v, 10) || 25);
  else if(bind === 'ptsLast') S.cfg.ptsLast = Math.max(1, parseInt(v, 10) || 15);
  else if(bind === 'pnum'){ var p = findPlayer(t, ds.pid); if(p) p.num = v.trim(); }
  else if(bind === 'cname'){ var c = curClub(); if(c) c.name = v; }
  else if(bind === 'champsel'){ ui.champSel = v; render(); return; }
  else if(bind === 'emf'){ if(ui.sheet && ui.sheet.draft) ui.sheet.draft[ds.k] = v; return; }
  else if(bind === 'ncname'){ ui.newClub.name = v; return; }
  else if(bind === 'evf'){ if(ui.ev) ui.ev[ds.k] = v; return; }
  else if(bind === 'mchamp'){
    S.matchChamp = v;
    if(S.fixtureRef && S.fixtureRef.cid !== v) S.fixtureRef = null;
    save(); render(); return;
  }
  else if(bind === 'mfix'){
    if(!v) S.fixtureRef = null; else applyFixture(S.matchChamp, v);
    save(); render(); return;
  }
  else if(bind === 'tclub'){
    var prev = clubById(S.teams[t].clubId), prevName = prev ? prev.name : '';
    switchClub(t, v);
    var nc = clubById(v), nm = (S.teams[t].name || '').trim();
    if(nc && (nm === '' || nm === 'Notre équipe' || nm === 'Adversaire' || nm === prevName)) S.teams[t].name = nc.name;
    ui.find[t] = '';
    save(); render(); return;
  }
  else if(bind === 'slot'){
    var pos = parseInt(ds.pos, 10), L = S.lineup[t];
    if(v){ var j = L.indexOf(v); if(j >= 0 && j !== pos) L[j] = L[pos]; }
    L[pos] = v || null;
    save(); render(); return;
  }
  else if(bind === 'champclub'){ ui.sheet['c' + t] = v; render(); return; }
  save();
});
function readTextFile(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var txt;
    try{ txt = new TextDecoder('utf-8', { fatal:true }).decode(fr.result); }
    catch(e){ txt = new TextDecoder('windows-1252').decode(fr.result); }
    cb(txt);
  };
  fr.onerror = function(){ ui.msg = 'Impossible de lire ce fichier.'; render(); };
  fr.readAsArrayBuffer(file);
}
document.addEventListener('change', function(e){
  var id = e.target.id, f = e.target.files && e.target.files[0];
  if(id === 'csvfile' && f) importFile(f);
  else if(id === 'logofile' && f) importLogo(f);
  else if(id === 'nclogo' && f) readLogo(f, function(url){ ui.newClub.logo = url; render(); });
  else if(id === 'memphoto' && f) readPhoto(f, function(url){ if(ui.sheet && ui.sheet.kind === 'editmember') ui.sheet.draft.photo = url; render(); });
  else if(id === 'pphoto' && f && ui.photoTarget){
    var tg = ui.photoTarget;
    readPhoto(f, function(url){ var pp = findPlayer(tg.t, tg.pid); if(pp){ pp.photo = url; save(); } render(); });
  }
  else if(id === 'restorefile' && f) readTextFile(f, function(txt){
    var obj = null;
    try{ obj = JSON.parse(txt); }catch(err){}
    if(!obj || obj.app !== 'volley-feuille-de-match' || !obj.data || !obj.data.teams || !obj.data.clubs){
      ui.msg = 'Ce fichier n\'est pas une sauvegarde de cette application.'; render(); return;
    }
    ui.pendingRestore = obj; ui.sheet = { kind:'restore' }; render();
  });
  if(id === 'csvfile' || id === 'logofile' || id === 'nclogo' || id === 'memphoto' || id === 'pphoto' || id === 'restorefile'){ try{ e.target.value = ''; }catch(err){} }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && ui.sheet){ ui.sheet = null; render(); return; }
  if(e.key !== 'Enter') return;
  var en = e.target.dataset && e.target.dataset.enter;
  if(!en) return;
  if(en === 'p0' || en === 'p1') addPlayer(parseInt(en.slice(1), 10));
  else if(en === 'clubcreate') createClub();
  else if(en === 'member') addMember();
  else if(en === 'champ') addChamp();
});
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible' && S.clock.running) keepAwake(); });

setInterval(function(){
  var txt = fmt(clockMs()), cs = document.querySelectorAll ? document.querySelectorAll('.clk') : [];
  for(var ci = 0; ci < cs.length; ci++) cs[ci].textContent = txt;
  if(S.tc){
    var left = Math.ceil((S.tc.endsAt - Date.now()) / 1000);
    if(left <= 0){ S.tc = null; save(); render(); }
    else { var el = document.getElementById('tcleft'); if(el) el.textContent = left + ' s'; }
  }
}, 250);

/* Bouton « précédent » du téléphone : voir setTab / onPop */
try{ history.replaceState({ v:'menu' }, ''); }catch(e){}
if(window.addEventListener) window.addEventListener('popstate', onPop);

/* Demande au navigateur de ne pas effacer les données de l'application (utile hors ligne) */
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

render();
})();
</script>
<script>
/* Hors ligne : enregistre le service worker (nécessite https, ou localhost) */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
