function readLogo(file, cb){
  var fr = new FileReader();
  fr.onerror = function(){ ui.msg = 'Impossible de lire cette image.'; render(); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ ui.msg = 'Ce fichier n\'est pas une image lisible.'; render(); };
    img.onload = function(){
      var w = img.naturalWidth || img.width || 128, h = img.naturalHeight || img.height || 128;
      var k = Math.min(1, 128 / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/png'));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- Clubs et import CSV ---------- */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  var first = (text.split(/\r?\n/).filter(function(l){ return l.trim(); })[0]) || '';
  var d = ';', best = -1;
  [';', ',', '\t'].forEach(function(c){ var n = first.split(c).length - 1; if(n > best){ best = n; d = c; } });
  var rows = [], row = [], cur = '', inQ = false;
  for(var i = 0; i < text.length; i++){
    var ch = text[i];
    if(inQ){
      if(ch === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else if(ch === '"') inQ = true;
    else if(ch === d){ row.push(cur); cur = ''; }
    else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i+1] === '\n') i++;
      row.push(cur); cur = '';
      if(row.some(function(c){ return c.trim() !== ''; })) rows.push(row);
      row = [];
    } else cur += ch;
  }
  row.push(cur);
  if(row.some(function(c){ return c.trim() !== ''; })) rows.push(row);
  return rows;
}
function colKey(h){

  if(n.indexOf('licen') >= 0) return 'licence';

  if(n === 'nom' || n.indexOf('nomde') === 0 || n === 'lastname' || n === 'surname') return 'nom';
  if(n === 'age' || n.indexOf('age') === 0) return 'age';

}
function importRows(rows){

  if(teamsMode && map.indexOf('equipe') < 0 && !defName){ ui.msg = 'Indiquez le nom de l\'équipe ou une colonne « équipe » dans le fichier.'; render(); return 0; }

/* Dans Claude : capacité « downloads ». Hors Claude (application installée) : téléchargement classique. */
function deliverFile(name, data, ext){
  var inClaude = !!(window.claude && window.claude.use);
  var p = inClaude ? window.claude.use('downloads') : Promise.resolve(null);
  Promise.resolve(p).then(function(dl){
    if(inClaude){
      if(!dl) throw { code:'unavailable' };
      return dl.save({ filename:name, data:data });
    }
    var blob = new Blob([data], { type: ext === 'csv' ? 'text/csv;charset=utf-8' : ext === 'ics' ? 'text/calendar;charset=utf-8' : 'application/json' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
  }).catch(function(err){
    if(err && err.code === 'declined') return;
    ui.sheet = { kind:'text', title:'Copier les données', note:'Le téléchargement n\'est pas disponible ici. Copiez ce texte et collez-le dans un fichier ' + (ext === 'csv' ? '.csv' : ext === 'ics' ? '.ics' : '.json') + '.', text:String(data).replace(/^\uFEFF/, '') };
    render();
  });
}
/* ---------- Export iCal (.ics) des rencontres à venir de la vue filtrée (idée A) ---------- */
function icsEsc(t){ return String(t == null ? '' : t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }

    if(n + b > (out.length ? 74 : 75)){ out.push(cur); cur = ''; n = 0; }
    cur += ch; n += b;

  return out.join('\r\n ');
}

function flowSvg(x){
  var W = 300, H = 72, mid = H / 2, mx = Math.max(4, Math.max.apply(null, x.diffs.map(Math.abs))), n = x.diffs.length - 1;
  var pts = x.diffs.map(function(d, i){ return (n ? i / n * W : 0).toFixed(1) + ',' + (mid - d / mx * (mid - 4)).toFixed(1); });
  var area = 'M0,' + mid + ' L' + pts.join(' L') + ' L' + W + ',' + mid + ' Z';
  return '<svg class="flow" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Écart de points au fil du set ' + x.no + '">' +
    '<defs><clipPath id="fa' + x.no + '"><rect x="0" y="0" width="' + W + '" height="' + mid + '"/></clipPath><clipPath id="fb' + x.no + '"><rect x="0" y="' + mid + '" width="' + W + '" height="' + mid + '"/></clipPath></defs>' +
    '<path d="' + area + '" fill="var(--a)" opacity=".45" clip-path="url(#fa' + x.no + ')"/><path d="' + area + '" fill="var(--b)" opacity=".45" clip-path="url(#fb' + x.no + ')"/>' +
    '<line x1="0" y1="' + mid + '" x2="' + W + '" y2="' + mid + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>' +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
}
function flowHtml(m){

  fs.forEach(function(x){
    out += '<div class="flowset"><div class="flowhead"><b>Set ' + x.no + (x.live ? ' (en cours)' : '') + '</b><span>' + x.fin[0] + ' – ' + x.fin[1] + '</span></div>' + flowSvg(x) +
      '<table class="flowt"><thead><tr><th></th><th>' + esc(tnOf(m, 0)) + '</th><th>' + esc(tnOf(m, 1)) + '</th></tr></thead><tbody>' +
      '<tr><th>Plus longue série</th><td>' + x.best[0] + '</td><td>' + x.best[1] + '</td></tr>' +
      '<tr><th>Plus grand écart</th><td>' + (x.lead[0] ? '+' + x.lead[0] : '–') + '</td><td>' + (x.lead[1] ? '+' + x.lead[1] : '–') + '</td></tr></tbody></table>' +
      (x.min ? '<p class="hint2" style="margin:4px 0 0">Durée : ' + x.min + ' min</p>' : '') + '</div>';
  });
  return out + '</section>';
}

/* ---------- Feuilles de saisie ---------- */
function chip(act, data, html, sel){
  var d = Object.keys(data).map(function(k){ return ' data-' + k + '="' + esc(data[k]) + '"'; }).join('');
  return '<button class="chip ' + (sel ? 'sel' : '') + '" data-act="' + act + '"' + d + '>' + html + '</button>';
}
function group(label, inner){ return '<div class="group"><p>' + label + '</p><div class="chips">' + inner + '</div></div>'; }
/* Service gagnant : seul le serveur (poste 1) ; bloc : les trois joueurs avant (postes 2, 3, 4) */
function whoAllowed(t, how){
  var L = S.lineup[t];
  if(how === 'ace') return L[0] ? [L[0]] : [];
  if(how === 'block') return [L[1], L[2], L[3]].filter(Boolean);
  return null;
}
function whoChips(t, selected, bench, how){
  var list = (bench ? benchOf(t) : onCourt(t)).slice().sort(sortP), al = whoAllowed(t, how);
  if(al) list = list.filter(function(p){ return al.indexOf(p.id) >= 0; });
  return list.map(function(p){ return chip('pickWho', { pid:p.id }, '<b' + (p.num ? '' : ' class="dflt"') + '>' + esc(effNum(p)) + '</b>' + esc(p.name) + (isCapOf(S, t, p.id) ? capBadge() : ''), selected === p.id); }).join('');
}
function plChip(act, p, t, extra){
  return chip(act, Object.assign({ pid:p.id }, extra || {}), '<b' + (p.num ? '' : ' class="dflt"') + '>' + esc(effNum(p)) + '</b>' + esc(p.name) + (isCapOf(S, t, p.id) ? capBadge() : ''), false);
}

function fitNames(){
  var els = document.querySelectorAll('.tname>span, .mc-team .nm');

    var el = els[i], box = el.parentNode, lim;

    var tm = el.closest('.tilemain'); lim = tm ? tm.clientWidth - 20 : box.clientWidth;

/* Cherche, dans un championnat, la rencontre prévue « domicile reçoit extérieur » : libre (résultat attendu), déjà jouée, ou absente. */
function fixtureState(ch, h, a){
  var all = ch.fixtures.filter(function(f){ return f.home === h && f.away === a; });
  all.sort(function(x,y){ return (x.date || '').localeCompare(y.date || ''); });
  var free = all.filter(function(f){ return !matchOf(ch, f.matchId); })[0] || null;
  if(free) return { st:'wait', f:free };
  if(all.length) return { st:'done', f:all[0], m:matchOf(ch, all[0].matchId) };
  return { st:'none', f:null };
}

function readTextFile(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var txt;
    try{ txt = new TextDecoder('utf-8', { fatal:true }).decode(fr.result); }
    catch(e){ txt = new TextDecoder('windows-1252').decode(fr.result); }
    cb(txt);
  };
  fr.onerror = function(){ ui.msg = 'Impossible de lire ce fichier.'; render(); };
  fr.readAsArrayBuffer(file);
}
