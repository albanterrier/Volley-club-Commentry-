<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E8ECF3; --ink:#101827; --muted:#566275; --line:#D3DAE5;
  --a:#1D5FA8; --a-ink:#FFFFFF; --b:#0B7A6C; --b-ink:#FFFFFF;
  --gold:#F0B429; --gold-ink:#1A1300; --danger:#B42318;
  --acc:#FF7A1A; --acc-ink:#1A0A00; --acc-text:#C2410C; --ok:#15803D;
  --head-bg:#121A28; --head-ink:#F1F4F9;
  --font-d:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1118; --surface:#161C27; --surface2:#1F2736; --ink:#F1F4F9; --muted:#A0ACBD; --line:#2A3445;
    --a:#5BA0EA; --a-ink:#07121C; --b:#34D3BD; --b-ink:#04201B;
    --acc-text:#FF9A4D; --ok:#3DD68C; --danger:#FF7A6B;
    --head-bg:#0D1118; --head-ink:#F1F4F9;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1118; --surface:#161C27; --surface2:#1F2736; --ink:#F1F4F9; --muted:#A0ACBD; --line:#2A3445;
    --a:#5BA0EA; --a-ink:#07121C; --b:#34D3BD; --b-ink:#04201B;
    --acc-text:#FF9A4D; --ok:#3DD68C; --danger:#FF7A6B;
    --head-bg:#0D1118; --head-ink:#F1F4F9;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden;touch-action:pan-y;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;max-width:100%;overflow-x:clip;touch-action:pan-y;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.4;padding-bottom:28px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);margin:0;line-height:1.1}
h2{font-size:26px;font-weight:700}
h3{font-size:20px;font-weight:700;margin-bottom:8px}
small{font-weight:500;opacity:.75}
.muted{color:var(--muted);font-size:14px}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-ink);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:10px 14px}
.hset{display:flex;flex-direction:column;line-height:1.15}
.hset strong{font-family:var(--font-d);font-size:24px;font-weight:700}
.hset span{font-size:13px;opacity:.8}
.clock{display:flex;align-items:center;gap:10px}
header.top .clk{font-family:var(--font-d);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.hbtn{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:8px;min-height:40px;padding:0 12px;font-weight:600}

/* Tableau de score */
main{max-width:720px;margin:0 auto}
.board{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:12px 12px 0}
.swapbtn{position:absolute;left:50%;top:calc(50% + 6px);transform:translate(-50%,-50%);z-index:3;width:46px;height:46px;border-radius:50%;border:3px solid var(--bg);background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.35)}

.tilemain:disabled{cursor:default}
.tname{font-family:var(--font-d);font-weight:600;font-size:21px;line-height:1.1;overflow-wrap:anywhere}
.score{font-family:var(--font-d);font-weight:800;font-size:clamp(84px,27vw,132px);line-height:.95;font-variant-numeric:tabular-nums}
.hint{font-size:13px;opacity:.85;min-height:18px}
.srv.ph{background:none;pointer-events:none}
.srv{background:rgba(0,0,0,.2);color:inherit;border:0;min-height:46px;width:100%;font-size:14px;font-weight:500}
.srv.on{background:var(--gold);color:var(--gold-ink);font-weight:700}
.srv:disabled{opacity:.6;cursor:default}

/* Commandes */
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 0}
.col{display:flex;flex-direction:column;gap:8px}
.btn{min-height:50px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font-weight:600;padding:8px 10px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}
.col.a .btn{border-left:6px solid var(--a)}
.col.b .btn{border-left:6px solid var(--b)}
.btn:disabled{opacity:.4;cursor:default}
.btn.wide{justify-content:center;text-align:center;border-left:1px solid var(--line)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 12px 0}
.last{padding:10px 14px 0;font-size:14px;color:var(--muted);margin:0}
.banner{margin:12px 12px 0;padding:12px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack>.banner{margin:0}
.tcbar{margin:12px 12px 0;padding:10px 14px;border-radius:10px;background:var(--gold);color:var(--gold-ink);display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.tcbar button{background:transparent;border:1.5px solid currentColor;border-radius:8px;min-height:38px;padding:0 10px;color:inherit;font-weight:600}

/* Affichage et terrain */
.prefs{display:flex;flex-wrap:wrap;gap:8px;padding:16px 12px 0}
.tg{min-height:44px;font-size:14px;min-width:0}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.cname{font-family:var(--font-d);font-weight:700;font-size:21px;line-height:1.1;display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.cname.pill{padding:3px 12px;border-radius:12px}
.tpill{display:inline-block;padding:2px 12px;border-radius:12px}
.cname.a{color:var(--a)}
.cname.b{color:var(--b)}
.cbtns{display:flex;gap:6px;flex-shrink:0}
.courtbox{max-width:640px;margin:0 auto;padding:14px 4px 0;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,3fr) minmax(0,1.12fr);gap:3px;align-items:start}
.cmid{min-width:0}
.court{border:2px solid var(--ink);background:var(--surface);border-radius:3px;display:grid;grid-template-columns:1fr 4px 1fr}
.half{position:relative;aspect-ratio:1/1;display:grid;min-width:0;container-type:inline-size}
/* équipe au service : le 1 recule (aux 4/5 du demi-terrain depuis le filet), le 5 et le 6 avancent (à la moitié) */
.half.l .pl.sv1{translate:-13.3cqw 0}
.half.r .pl.sv1{translate:13.3cqw 0}
.half.l .pl.sv56{translate:16.7cqw 0}
.half.r .pl.sv56{translate:-16.7cqw 0}
.half.l{grid-template-columns:2fr 1fr}
.half.r{grid-template-columns:1fr 2fr}
.half.t0{background:rgba(29,95,168,.09)}
.half.t1{background:rgba(11,122,108,.1)}
.colp{display:grid;grid-template-rows:repeat(3,1fr);justify-items:center;align-items:center;min-width:0}
/* ligne des 3 m : à 1/3 de la profondeur de chaque demi-terrain */
.half.l .colp.back{border-right:2px solid var(--ink)}
.half.r .colp.back{border-left:2px solid var(--ink)}
.netbar{width:4px;background:var(--ink);position:relative;z-index:2;margin:-6px 0}
.rotrow{display:grid;grid-template-columns:1fr 1fr;justify-items:center;margin-top:8px}
.tlist{min-width:0}
.tl{list-style:none;margin:0;padding:0}
.plrow{display:flex;gap:3px;align-items:baseline;font-weight:700;font-size:clamp(8px,2.7vw,13px);line-height:1.15;padding:2px 0;margin:0;min-height:0;height:auto;border:0;min-width:0;white-space:nowrap}
.plrow .pn{min-width:1.6em;text-align:right;font-family:var(--font-d);font-weight:800}
.plrow .pt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.plrow.off{opacity:.45}
.plrow.sub::after{content:"●";font-size:.7em;align-self:center;margin-left:auto;color:var(--a)}
.tlist[data-team="1"] .plrow.sub::after{color:var(--b)}
.lsep{list-style:none;border-top:2px solid var(--ink);margin:5px 0;height:0;min-height:0;padding:0;border-bottom:0;display:block}
.pl{width:clamp(15px,6.8vw,38px);height:clamp(15px,6.8vw,38px);box-sizing:border-box;flex-shrink:0;border-radius:50%;border:2px solid var(--a);background:var(--surface);font-family:var(--font-d);font-weight:800;font-size:clamp(9px,3.4vw,18px);line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.pl.b{border-color:var(--b)}
.pl.srv2{box-shadow:0 0 0 2px var(--gold)}
.pl.empty{border-style:dashed;color:var(--muted);font-weight:600}
.mini{min-height:44px;padding:4px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600;font-size:14px;min-width:44px}
.logo{object-fit:contain;background:#fff;border-radius:6px;padding:2px;flex-shrink:0;vertical-align:middle}
.tname{display:flex;align-items:center;justify-content:center;gap:8px}
.tname>span{min-width:0}
.logoedit{display:flex;align-items:center;gap:14px;margin-top:6px}
.logoedit .logo{border:1px solid var(--line)}
.logoedit .logo.none{width:64px;height:64px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}

/* Cartes et formulaires */
.stack{padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.a{border-top:6px solid var(--a)}
.card.b{border-top:6px solid var(--b)}
label.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],input[inputmode],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px}
textarea{min-height:120px;font-size:16px}

.pl{position:relative}
.cap.capb{position:absolute;right:-6px;bottom:-6px;margin:0;width:14px;height:14px;color:var(--ink)}
.addrow1{display:grid;grid-template-columns:50px 1fr;gap:8px;margin-top:6px;align-items:center}
.addrow3{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px;align-items:center}
.numerr{color:var(--danger);font-weight:600;margin:6px 0 0;font-size:14px}
.shirt input.snum.bad{outline:2px solid var(--danger);outline-offset:1px;color:var(--danger)}
.memhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px}
.memhead h3{margin:0}
.memhead .addbtn{position:static;width:40px;height:40px}
.cmpgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:10px;align-items:start;margin-top:8px}
.cmplist{list-style:none;margin:0;padding:0}
.pl.me{box-shadow:0 0 0 3px var(--gold),0 0 12px 2px var(--gold);background:var(--gold);color:#000}
.cmprow.me{background:rgba(255,193,7,.28);border-radius:8px;padding-left:6px;padding-right:6px;font-weight:700;box-shadow:inset 3px 0 0 var(--gold)}
.cmpbox.me{box-shadow:0 0 0 2px var(--gold);border-radius:10px}
.cmprow{font-size:14px;line-height:1.25;padding:5px 0}
.cmprow .cn{font-family:var(--font-d);font-weight:400}
.cmpsep{list-style:none;border-top:2px solid var(--ink);margin-top:6px;padding:6px 0 2px;font-size:14px}
.cmprow.empty{color:var(--muted)}
.cmpcourt{min-width:0}
.court.one{grid-template-columns:1fr}
.vcourt{max-width:260px;margin:0 auto}
.vnet{position:relative;height:12px;background:var(--ink);border-radius:3px;margin:0 -8px;z-index:2;display:flex;align-items:center;justify-content:center;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 2px,transparent 2px 7px)}
.vnet span{font-size:8px;font-weight:800;letter-spacing:.2em;color:#fff;background:var(--ink);padding:0 6px;line-height:12px}
.vhalf{border:2px solid var(--ink);border-top:0;background:var(--surface);aspect-ratio:1/1;display:grid;grid-template-rows:1fr 2fr;container-type:inline-size}
.vrow{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;align-items:center}
.vrow.front{border-bottom:2px solid var(--ink)}
.vhalf.t0{background:rgba(29,95,168,.09)}
.vhalf.t1{background:rgba(194,65,12,.09)}
.ifwrap{position:relative;display:block;width:100%}
.ifwrap input{width:100%;box-sizing:border-box;min-height:46px;height:46px;padding-right:46px;margin:0}
.ifok{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:#2F9E5B;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.ifbtn{box-sizing:border-box;width:100%;min-height:46px;height:46px;justify-content:center;text-align:center;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;line-height:30px}
.ifbtn.ph{color:var(--muted);font-weight:500}
.tmrow{display:grid;grid-template-columns:116px 1fr;gap:10px;align-items:center}
label.f.tmlab,span.f.tmlab{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
.tmchbtn{justify-content:center;text-align:center;width:100%;font-weight:600}
.tmrow input,.tmrow select,.tmrow .tmchbtn{box-sizing:border-box;width:100%;height:46px;min-height:46px;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.plist li{display:flex;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--line)}

.shirt input.snum,.shirt .snum-t{position:absolute;left:25%;top:34%;width:50%;height:50%;min-height:0;margin:0;padding:0;border:0;background:transparent;box-shadow:none;text-align:center;font-family:var(--font-d);font-weight:800;color:inherit;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1}
.shirt input.snum{display:block;line-height:26px;border-radius:4px}
.shirt input.snum:focus{outline:2px solid #F2B705;outline-offset:1px;background:rgba(255,255,255,.7)}
.shirt input.snum.l2,.shirt .snum-t.l2{font-size:14px}.shirt input.snum.l3,.shirt .snum-t.l3{font-size:10px}.shirt input.snum.l4,.shirt .snum-t.l4{font-size:8px}
.shirt input.snum::placeholder{font-size:11px;font-weight:600;color:var(--muted)}
.shirt.shirt-s{width:44px;height:44px;vertical-align:middle;margin-right:6px}
.plist input.pnum{width:58px;min-height:44px;text-align:center;font-family:var(--font-d);font-weight:700;font-size:22px;padding:2px}
.plist .nm{flex:1;overflow-wrap:anywhere}
.plist .pos{font-size:13px;color:var(--muted);white-space:nowrap}
.del{border:0;background:transparent;padding:0;min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.addrow{display:grid;grid-template-columns:50px 1fr auto;gap:8px;margin-top:6px;align-items:center}
.addrow2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.res{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.res .btn{min-height:48px}

/* Tableaux */
.tablewrap{overflow-x:auto;max-width:100%;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line)}
th:first-child{z-index:2}
th{font-weight:600;color:var(--muted)}
.tbl-left th,.tbl-left td{text-align:left}
.tbl-left th:last-child,.tbl-left td:last-child{text-align:center;padding-left:6px;padding-right:6px}
.cut{display:block;max-width:min(44vw,190px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td:first-child .fxteam{max-width:min(44vw,190px)}
td:first-child .fxteam .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delwrap{background:none;border:0;padding:0;min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center}
.delc{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.xic{display:block;width:24px;height:24px;object-fit:contain}
td.pts{font-weight:800;font-size:16px}
.sortb{background:none;border:0;padding:6px 4px;min-height:40px;font-weight:600;color:var(--muted)}
.sortb.on{color:var(--ink)}
.rank{color:var(--muted);font-variant-numeric:tabular-nums;padding-right:4px}
.setline{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.setchip{font-family:var(--font-d);font-weight:700;font-size:22px;border:1px solid var(--line);border-radius:8px;padding:4px 12px}
.log{list-style:none;margin:8px 0 0;padding:0}
.log li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.log .t{font-variant-numeric:tabular-nums;color:var(--muted);min-width:46px}
.log .sc{margin-left:auto;font-weight:700;white-space:nowrap}
.btnrow{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.mrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.mrow .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.vh:focus-visible + label{outline:3px solid var(--gold);outline-offset:2px}
.bigstat{font-size:20px;margin:12px 0 4px}
.bigstat b{font-family:var(--font-d);font-size:56px;font-weight:800;margin-right:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 16px;max-width:320px}
.kv b{font-variant-numeric:tabular-nums;text-align:right}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* En-tête de la saisie des points : score en sets, ou tableau des scores */
header.top.hc,header.top.ho{flex-wrap:nowrap;gap:8px}
.hscore{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px}
.hscore .hn{flex:0 1 auto;min-width:0;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-d);font-weight:700;font-size:20px}
.hscore b{font-family:var(--font-d);font-size:30px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.hchev{flex:0 0 auto;width:40px;height:40px;border:0;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;border-radius:8px;padding:0}
.hchev svg{transition:transform .15s}
.hchev.open svg{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.hchev svg{transition:none}}
header.top.ho{align-items:flex-start}
.htab{flex:1;min-width:0;width:auto;border-collapse:collapse;border-spacing:0;font-family:var(--font-d)}
.htab th,.htab td{border:0;background:transparent;color:inherit;padding:3px 8px;text-align:center;font-size:22px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.htab th:first-child{position:static;box-shadow:none;text-align:left;padding-left:0;max-width:32vw}
.htab .hn{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.htab td.hw{font-size:28px;font-weight:800}
.htab td.w{color:var(--gold)}
.htab td.l{opacity:.8}
.htab td.cur{background:rgba(255,255,255,.16);border-radius:8px}
.setlbl{position:absolute;left:50%;top:calc(12px + (min(100vw,720px) - 34px) / 12);transform:translate(-50%,-50%);z-index:1;font-size:13px;font-weight:700;white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 9px}

/* Photos, boutons d'édition, menu */
.avw{position:relative;display:inline-flex;flex-shrink:0}
.pdot{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;box-sizing:border-box;box-shadow:0 0 0 2px var(--surface,#fff)}
.pdot.none{background:#8A93A0}
.pdot.linked{background:#fff;border:3px solid #2EA043}
.pdot.live{background:#2EA043}
.pdlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:6px 0 8px}
.pdlegend .pdot{position:static;display:inline-block;vertical-align:-2px;margin-right:4px;box-shadow:none}
.av{border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--line);vertical-align:middle}
.av.ph{display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);font-family:var(--font-d)}
.avbtn{background:none;border:0;padding:0;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.editc{width:24px;height:24px;border-radius:50%;background:#6B7B8C;color:#fff;display:flex;align-items:center;justify-content:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .editc{background:#51657A}}
:root[data-theme="dark"] .editc{background:#51657A}
.actcell{display:flex;align-items:center;justify-content:center;gap:0}
.pcell{display:flex;align-items:center;gap:10px}
details.card>summary{cursor:pointer;font-family:var(--font-d);font-weight:700;font-size:20px;min-height:44px;display:flex;align-items:center}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 12px 6px}
.brand .logo{background:transparent;padding:0}
.brand h1{font-size:32px;font-weight:800;line-height:1.05}
.brand p{margin:0;color:var(--muted);font-size:15px}
/* Menu : Match (rouge) à gauche, trois boutons à droite, Données (gris) dessous */
.menugrid2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,88px) 76px;gap:12px;padding:18px 12px 0;max-width:560px;margin:0 auto}
.mbtn{border:0;border-radius:16px;color:#fff;font-family:var(--font-d);font-weight:700;font-size:28px;line-height:1.05;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 6px;min-width:0}
.mbtn:active{filter:brightness(.9)}
.m-match{grid-column:1;grid-row:1 / span 3;background:#C62828;font-size:46px}
.m-clubs{grid-column:2;grid-row:1;background:#1D5FA8}
.m-champ{grid-column:2;grid-row:2;background:#2E7D32}
.m-cal{grid-column:2;grid-row:3;background:#6A3FA0}
.m-data{grid-column:1 / span 2;grid-row:4;background:#5A6B7C}
.menugrid{display:grid;grid-template-columns:1fr;gap:12px;padding:14px 12px 0;max-width:520px;margin:0 auto}
.menubtn{width:100%;min-height:84px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:12px 18px;text-align:left}
.menubtn b{font-family:var(--font-d);font-size:28px;font-weight:700;line-height:1.1}
.menubtn span{font-size:14px;color:var(--muted)}
.menubtn.live{border-color:var(--gold);border-width:2.5px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tot td{font-weight:800}
.statgrid div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;line-height:1.1}
.statgrid b{display:block;font-family:var(--font-d);font-size:28px;font-weight:800}
.statgrid span{font-size:12px;color:var(--muted)}

/* Chrono central et accueil */
.bigclock{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px 0}
.bigclock .clk{font-family:var(--font-d);font-weight:800;font-size:clamp(56px,18vw,80px);line-height:1;font-variant-numeric:tabular-nums}
.bigclock.paused .clk{opacity:.5}
.hbtn2{min-height:42px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:0 18px;font-weight:600}
.hbtn2:disabled{opacity:.4}
.bigbtn{width:100%;min-height:84px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--font-d);font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;gap:10px}
.bigbtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bigbtn:disabled{opacity:.45}
.ritem{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.ritem:last-child{border-bottom:0}
.ritem .fx{border-bottom:0;flex:1}
.fxt .nm{font-weight:600;overflow-wrap:anywhere}
.fxt small{opacity:1;color:var(--muted);font-weight:400}
.rsc{font-family:var(--font-d);font-weight:800;font-size:24px;white-space:nowrap}
.playc{width:24px;height:24px;border-radius:50%;background:#2E7D32;color:#fff;display:flex;align-items:center;justify-content:center}
.ritem .rinfo{cursor:default}

/* Lien Sauvegarde et mention en bas du menu */
.seasonbtn{font:inherit;font-size:14px;font-weight:700;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:var(--head-ink);cursor:pointer;white-space:nowrap}
.seasonbtn.onbg{background:var(--surface);color:var(--ink);border-color:var(--line)}
.seasonrow{display:flex;justify-content:center;margin:14px 0 0}
.tmp{display:inline-block;font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border:1px dashed var(--muted);border-radius:6px;padding:0 5px;line-height:1.5;vertical-align:middle}
.todaymark{display:flex;align-items:center;gap:10px;margin:2px 0;scroll-margin-top:84px;color:var(--a);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.todaymark::before,.todaymark::after{content:"";flex:1;height:2px;background:var(--a)}
.fchips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.fchip{min-height:40px}
.backupbox{margin:16px 14px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.backupbox.warn{border-color:#C2410C}
.backupbox .btn{width:100%}
.bkmsg{margin:8px 0 0;font-size:14px;color:var(--muted)}
.bkmsg.warnt,.backupbox.warn .bkmsg{color:#C2410C;font-weight:600}
.menulink{display:flex;justify-content:flex-end;padding:6px 14px 0}
.linkbtn{background:none;border:0;padding:12px 4px;min-height:44px;font:inherit;font-size:16px;color:var(--acc-text);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.menufoot{margin:0;padding:22px 12px 10px;text-align:center;color:var(--muted);font-style:italic;font-size:14px}

/* Interrupteurs coulissants de l'en-tête déplié (bleu = actif, gris = inactif) */
header.top.ho{flex-direction:column;align-items:stretch}
.hrow{display:flex;gap:8px;align-items:flex-start}
.hsws{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:0 8px;padding-top:4px;border-top:1px solid rgba(255,255,255,.18)}
.hsw{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;background:none;border:0;color:inherit;font-size:clamp(10px,3.1vw,14px);font-weight:600;padding:4px 0;min-height:44px;text-align:left}
.hsw .track{position:relative;flex:0 0 auto;width:36px;height:20px;border-radius:10px;background:#7B8794;transition:background .15s}
.hsw .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .15s}
.hsw[aria-checked="true"] .track{background:#2F7DE1}
.hsw[aria-checked="true"] .knob{transform:translateX(16px)}
@media (prefers-reduced-motion:reduce){.hsw .track,.hsw .knob{transition:none}}

/* Domicile / extérieur */
.hacell{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);min-width:0}
.hacell small{display:block;color:var(--muted);font-weight:600;margin-bottom:4px}
.prepbtn{flex-direction:column;gap:4px;align-items:center;min-height:72px;padding:8px 6px;text-align:center}
.prepbtn small{opacity:.8;font-weight:500;font-size:12px}
.otherin{margin-top:6px}

/* Page « Logo et couleurs » */
.lookgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lookcard{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;font-weight:600;font-size:14px;min-width:0}
.lookcard.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.lookcard .pv{display:block;width:100%;max-width:none;box-sizing:border-box;margin:0;padding:0;height:52px;border-radius:8px;border:1px solid rgba(0,0,0,.15);overflow:hidden;flex-direction:initial;gap:0}
.lookprev{display:flex;gap:12px;align-items:stretch}
.pvtile{flex:1;border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:116px;text-align:center}
.pvtile .pvn{font-family:var(--font-d);font-weight:700;font-size:18px;line-height:1.1;overflow-wrap:anywhere}
.pvtile b{font-family:var(--font-d);font-size:60px;font-weight:800;line-height:1}
.pvside{display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:112px}
.pvbtn{padding:9px 10px;border-radius:10px;font-weight:600;font-size:14px;text-align:center}
.pvcirc{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:800;font-size:22px;align-self:center;border:3px solid transparent}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0;position:relative}
.sw.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.sw.other{display:inline-flex;align-items:center;justify-content:center;background:conic-gradient(#D32F2F,#FBC02D,#2E7D32,#1565C0,#6A1B9A,#D32F2F);color:#fff;font-weight:800;font-size:20px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.6)}

/* Écran de match : logo sur la tuile, boutons image, chrono central, rotation sur le terrain */
.tilebox{position:relative;display:flex;flex-direction:column;padding-top:23.4%}
.tilebox .tile{flex:1}
.tlogo{position:absolute;top:0;left:50%;transform:translateX(-50%);width:33.33%;aspect-ratio:1/1;box-sizing:border-box;object-fit:contain;background:#fff;border-radius:16%;padding:3%;box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:2}
.tilebox .tilemain{padding-top:24px}
.ctlrow{display:flex;align-items:center;gap:8px;padding:12px 12px 0}
.ig{display:flex;gap:6px;flex:0 0 auto}
.tbtn{width:clamp(48px,14.5vw,58px);min-height:78px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tbtn.a{border-color:var(--a)}
.tbtn.b{border-color:var(--b)}
.tbtn:disabled{opacity:.4;cursor:default}
.tbtn .cnt{font-size:13px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ico{display:block;width:34px;height:34px;background-color:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}

.clkbox{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.clkbox .clk{font-family:var(--font-d);font-weight:800;font-size:clamp(24px,8vw,32px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.clkbox.paused .clk{opacity:.5}
.hbtn2.sm{min-height:34px;padding:0 6px;font-size:12px;max-width:100%;white-space:nowrap}
.rotbtn{flex-shrink:0;z-index:3;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:0;display:flex;align-items:center;justify-content:center}
.rotbtn.a{border-color:var(--a)}
.rotbtn.b{border-color:var(--b)}

/* Commandes sous le chrono : annuler / lecture-pause / stop */
.cbar{display:flex;justify-content:center;gap:clamp(2px,1vw,5px);width:100%}
.cbtn{flex:0 0 auto;width:clamp(24px,7.6vw,32px);height:clamp(28px,8.4vw,36px);border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.cbtn .ico{width:68%;height:68%}

/* Calendrier */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;min-height:48px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.fx{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;min-height:64px}
.fx:last-child{border-bottom:0}
.fxd{display:flex;flex-direction:column;min-width:74px;font-weight:600;font-size:14px;line-height:1.2}
.fxt{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.fxteam{display:flex;align-items:center;gap:8px;min-width:0}
.fxteam .nm{flex:1;overflow-wrap:anywhere}
.fxteam b{font-family:var(--font-d);font-size:22px;min-width:20px;text-align:right}
.fxteam.win .nm{font-weight:700}
.tag.warn{color:var(--danger);border-color:var(--danger)}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:none;border:0;border-top:4px solid transparent;min-height:60px;font-weight:600;font-size:12.5px;color:var(--muted);padding:0 2px}
.nav button.on{border-top-color:var(--gold);color:var(--ink)}

/* Feuille de saisie */
#sheet .back{position:fixed;inset:0;z-index:40;background:rgba(5,12,20,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--surface);width:100%;max-width:720px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet .panel{animation:none}}
.navbar{position:sticky;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0);background:var(--bg);box-shadow:0 -6px 8px -6px rgba(0,0,0,.18)}
.homerow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.homerow .homebtn{grid-column:2}
.homerow .prevbtn{grid-column:3;justify-self:end}

.tabs2{margin-top:0}
.evsw{display:flex;gap:18px;margin:6px 4px 0}.evsw button{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;font-weight:600;padding:0;cursor:pointer}.evsw button.on{color:var(--ink)}
.row3{grid-template-columns:repeat(3,minmax(0,1fr))}
.clubhead h2 .hlg{display:inline-flex;vertical-align:middle;margin-right:8px}
.clubhead h2 .hlg .logo{object-fit:contain;border-radius:8px}
.group{margin-top:14px}
.group>p{margin:0 0 6px;font-weight:600;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}
.cols.one{grid-template-columns:1fr}
.cols .chips{flex-direction:column;flex-wrap:nowrap;gap:8px}
.cols .chip{width:100%;justify-content:flex-start;min-width:0;text-align:left;line-height:1.15}
.cols.one .chip{justify-content:center}
.chip{min-height:52px;min-width:64px;padding:6px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.chip b{font-family:var(--font-d);font-size:24px;font-weight:700}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel .close{margin-top:16px;width:100%}
.hint2{margin:12px 0 0;font-size:14px;color:var(--muted)}

/* ===== Style Stitch : en-tête, barre du bas, cartes, agenda ===== */
body{padding-bottom:28px}
body.hasnav{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header.top{border-bottom:1px solid rgba(255,255,255,.08)}
.hl{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.hr{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ibtn{position:relative}
.ibtn .dotred{position:absolute;top:7px;right:6px;width:12px;height:12px;border-radius:50%;background:#E53935;border:2px solid var(--bg,#0e1621);box-sizing:border-box}
.ibtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.ibtn:active{background:rgba(255,255,255,.14)}
.ibtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn.mbtn{background:transparent;border:0;color:inherit;border-radius:50%}
/* Bouton Accueil (logo) : rond au contour blanc, relief et ombre — identique en mode sombre et clair */
header.top .hl>.ibtn[data-tab="menu"]{width:46px;height:46px;border-radius:50%;border:2px solid #fff;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.16),rgba(255,255,255,.02) 60%);box-shadow:0 4px 8px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.35) inset,0 -2px 3px rgba(0,0,0,.35) inset;transition:transform .08s,box-shadow .08s}
header.top .hl>.ibtn[data-tab="menu"] img{width:30px;height:30px}
header.top .hl>.ibtn[data-tab="menu"]:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(0,0,0,.5),0 -2px 3px rgba(0,0,0,.35) inset}

.ibtn img{width:34px;height:34px;border-radius:9px;display:block}
.hset{min-width:0}
.hset strong,.hset span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.primary,.bigbtn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip.sel,.seg button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.banner{background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--acc)}
.linkbtn{color:var(--acc-text)}
.todaymark{color:var(--acc-text)}
.todaymark::before,.todaymark::after{background:var(--acc)}
.backupbox.warn{border-color:var(--acc)}
.bkmsg.warnt,.backupbox.warn .bkmsg{color:var(--acc-text)}
.hsw[aria-checked="true"] .track{background:var(--acc)}
.mbtn{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.m-clubs,.m-champ,.m-cal,.m-data{background:var(--surface)}
.m-match{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.tag{font-weight:700}
.tag.up{color:var(--acc-text);border-color:var(--acc)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--danger);border-color:var(--danger)}
/* barre du bas */
.nav{position:fixed;left:50%;right:auto;width:min(100%,720px);transform:translateX(-50%);bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;min-height:56px;font-size:12px;font-weight:600;color:var(--muted);padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px}
.nav button .pill{display:flex;align-items:center;justify-content:center;width:54px;height:30px;border-radius:15px}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--acc-text)}
.nav button.on .pill{background:rgba(255,122,26,.18)}
.fab{position:fixed;z-index:25;right:max(16px,calc(50% - 344px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:34px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4);padding:0 0 3px}
/* agenda */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes .chip{min-width:0;min-height:44px;border-radius:22px;padding:6px 8px}
.strip{padding:12px}
.stripH{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.stripH b{font-family:var(--font-d);font-size:20px;text-transform:capitalize}
.stripH .ibtn{color:var(--ink);width:44px;height:44px}
.stripH .ibtn:active{background:var(--surface2)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{background:none;border:1px solid transparent;border-radius:12px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);padding:2px 0;position:relative}
.day small{font-size:12px;font-weight:700;letter-spacing:.03em;opacity:1;color:var(--muted)}
.day b{font-family:var(--font-d);font-size:22px;line-height:1}
.day .dots{display:flex;gap:3px;height:7px;align-items:center}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.dt{background:#35b26a}.da{background:#f0c235}.dc{background:#e5484d}.do{background:#8b97b3}
.day.sel .dot{box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.mc-ctx .dot{margin-right:6px;vertical-align:1px}
.chip .dot{margin-right:6px}
.dowrow{display:flex;gap:4px;flex-wrap:nowrap}
.dowrow .chip{flex:1 1 0;min-width:0;padding:6px 0}
.day.today{border-color:var(--acc)}
.day.sel{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.day.sel small{color:var(--acc-ink)}
.wkblock{display:flex;flex-direction:column;gap:10px}
.wkh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 2px 0}
.wkh h3{margin:0;font-size:22px}
.mc-foot s{opacity:.7}
.rep{color:var(--danger);font-weight:700;margin-left:6px}
.exempt{margin:6px 2px 0;font-size:14px;color:var(--muted)}
.exempt b{color:var(--ink)}
.exempt i{font-style:normal;color:var(--danger);font-weight:700}
.mcs{display:flex;flex-direction:column;gap:10px}
.mc{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.mc.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mc-ctx{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mc-b{display:flex;gap:6px;flex-shrink:0}
.mc-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.mc-team{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.mc-team .nm{font-weight:600;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.mc-mid.vs{font-size:15px;font-weight:700;color:var(--muted);min-width:34px}
.mc-team.win .nm{font-weight:800}
.mc-mid{text-align:center;font-family:var(--font-d);font-weight:800;font-size:30px;line-height:1;min-width:64px;white-space:nowrap}
.mc-title{font-family:var(--font-d);font-weight:700;font-size:22px;line-height:1.1}
.mc-foot{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.mc-sets{font-size:13px;color:var(--muted);text-align:center}
.mc-foot.c{justify-content:center;text-align:center}
.mc-top .mc-ctx{text-align:right}
.mc-foot3{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.mc-foot3 .fl{justify-self:start}
.mc-foot3 .fr{justify-self:end}
.prs{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line-ui);background:var(--bg);color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
.prs.ok{background:#2e9e5b;border-color:#2e9e5b;color:#fff}
.prs.bad{background:#d64545;border-color:#d64545;color:#fff}
.pcnt{font-weight:700}.pcnt b{font-weight:800}.pcnt .cp{color:#2e9e5b}.pcnt .ca{color:#d64545}
.prs.ok .pcnt .cp{color:#fff}.prs.ok .pcnt .ca{color:#ff2a2a;text-shadow:0 0 1px #000,0 0 3px #000,0 0 4px rgba(0,0,0,.6)}
.prs.bad .pcnt .cp{color:#2dff7a;text-shadow:0 0 1px #000,0 0 3px #000,0 0 4px rgba(0,0,0,.6)}.prs.bad .pcnt .ca{color:#fff}
.prs .pcnt b{font-weight:900}
.mc-att{font-size:13px;color:var(--muted);text-align:center}
.mc-att b.ok{color:#35b26a}.mc-att b.bad{color:#e5484d}
div.mc{cursor:pointer}
.mc-foot3 .fm{min-width:0}
.mc-foot.near{flex-direction:column;align-items:center;gap:2px}
.mc-day{font-size:16px;font-weight:700;color:var(--ink)}
.mc-time{font-family:var(--font-d);font-weight:800;font-size:30px;line-height:1;color:var(--ink)}
.stripH span{display:flex}
.mbtn{font-size:clamp(20px,6.4vw,28px)}
.m-match{font-size:clamp(34px,11vw,46px)}
.hl .hset strong{font-size:20px}
.hr .seasonbtn{min-height:40px;padding:0 12px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px}

.homebtn{background:var(--surface2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.ico-prev{background-color:var(--ink)}
.prevbtn{border:1px solid var(--line)}
.navbar{background:var(--bg);border-top:1px solid var(--line);box-shadow:none}

.stripH span{align-items:center}
.stripH .ibtn{min-height:44px;height:44px}
.nav button{font-size:11.5px;letter-spacing:-.01em}

/* ===== Lisibilité et zoom (point 3) ===== */
:root{--line-ui:#7F8B9E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--line-ui:#5F6E86}}
:root[data-theme="dark"]{--line-ui:#5F6E86}
html,body{touch-action:manipulation}
.tablewrap{touch-action:pan-x pan-y pinch-zoom}
button,a,select,label,[data-act]{touch-action:manipulation}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],input[inputmode],select,textarea{border-color:var(--line-ui);font-size:16px}
.btn,.chip,.seg,.hbtn2,.fchip{border-color:var(--line-ui)}
.btn.danger{border-color:var(--danger)}
.btn.primary,.chip.sel,.bigbtn.primary{border-color:var(--acc)}
.hset span,.hint,.setlbl,.todaymark,.plist .pos{font-size:14px}
.tag,.mrow .tag,.mc-ctx,.statgrid span,.prepbtn small,.hbtn2.sm,.homerow .mini2,.mc-sets,.day small,.tbtn .cnt{font-size:13px}
.nav button{font-size:12px;letter-spacing:-.02em}
.mc-body{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.mc-team .nm{overflow-wrap:break-word;word-break:normal;hyphens:auto}
@media (max-width:340px){
  .hl .hset strong{font-size:17px}
  .hr .seasonbtn{font-size:13px;padding:0 8px}
  .ibtn{width:40px}
  .mc-mid{min-width:48px;font-size:26px}
  .mc-team .nm{font-size:15px}
  .mc-mid.vs{min-width:28px;font-size:13px}
  .nav button{font-size:11px;letter-spacing:-.03em}
}

/* ===== Messages (point 5) et mode lecture / modification (point 6) ===== */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:70;width:min(92vw,520px);pointer-events:none}
body.hasfab #toast{bottom:calc(158px + env(safe-area-inset-bottom,0px))}
.tmsg{pointer-events:auto;background:var(--surface2);color:var(--ink);border:1px solid var(--line-ui);border-left:5px solid var(--acc);border-radius:12px;padding:12px 14px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:up .18s ease-out}
.tmsg.err{border-left-color:var(--danger)}
@media (prefers-reduced-motion:reduce){.tmsg{animation:none}}
[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 2px var(--danger)}
.editbtn{position:absolute;left:0;top:0;width:48px;height:48px;border-radius:50%;border:1px solid var(--line-ui);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.editbtn.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

/* ===== Point 1 : listes directes, boutons de création orange ===== */
.addbtn{background:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.addbtn .ico-plus{background-color:var(--acc-ink)}
.fab{background:var(--acc)}
body:not(.hasfab) .fab{display:none}
.sbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbar .chip{min-height:46px;border-radius:23px}
.cnt{margin:2px 2px 0;font-size:14px;color:var(--muted)}
.fx.big{min-height:64px}
body.hasfab .tmsg{margin-bottom:0}

.homenext{max-width:560px;margin:18px auto 0;padding:0 12px;display:flex;flex-direction:column;gap:10px}
.homenext h2{font-size:15px;margin:6px 4px 0;color:var(--muted);font-weight:600}

.formbox h3{margin:14px 0 4px}
.formbox .frow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0;flex-wrap:wrap}
.formbox .fchips{display:flex;gap:4px;flex-wrap:wrap}
.flowset{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.flowset:first-of-type{border-top:0;padding-top:0}
.flowhead{display:flex;justify-content:space-between;font-size:16px;margin-bottom:4px}
svg.flow{display:block;width:100%;height:72px;background:var(--surface2);border-radius:8px}
.flowt{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.flowt th,.flowt td{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line)}
.flowt th:first-child{text-align:left;font-weight:500;color:var(--muted)}
.flowt thead th{font-weight:600;color:var(--ink)}
@media print{
  html:root[data-theme]{--bg:#fff;--surface:#fff;--surface2:#fff;--ink:#000;--muted:#333;--line:#999;--line-ui:#777;--head-bg:#fff;--head-ink:#000;--acc-text:#000}
  html,body{background:#fff!important;color:#000!important}
  header.top,.nav,.fab,#toast,.btnrow,.hbtn,.ibtn,.editbtn,.homebtn,.menubtn,button,[data-act="tab"]{display:none!important}
  .card,section{break-inside:avoid;box-shadow:none!important;border:1px solid #999!important;background:#fff!important}
  main{padding:0!important;max-width:none!important}
  details>summary{list-style:none}
  a{color:#000}
}

.profpick{max-width:420px;margin:0 auto;padding:40px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.profpick h1{font-size:26px;margin:6px 0 0}
.profpick .stack{width:100%;margin-top:12px}
.profpick .bigbtn{font-size:22px;padding:14px 12px;line-height:1.2}
.profpick .bigbtn small{display:block;font-size:15px;font-weight:500;opacity:.85;margin-top:6px}
.profid{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:18px}

header.top.hc,header.top.ho{padding:6px 8px 6px 4px}
header.top.ho{gap:4px}
.hmain{display:flex;align-items:center;gap:0;min-width:0;width:100%}
.hmain .hscore{flex:1;min-width:0;gap:4px;padding:0}
.hmain .hscore .hn{font-size:13px;max-width:40%;font-weight:600}
.hmain .hscore b{font-size:20px}
.hmain .hchev{width:40px;height:44px}
header.top.ho .hrow{width:100%}
header.top.ho .htab th,header.top.ho .htab td{font-size:18px}
header.top.ho .htab td.hw{font-size:22px}

.tbtn .cnt{color:inherit}

.tbtn.sq{width:clamp(48px,14.5vw,58px);min-height:0;height:clamp(48px,14.5vw,58px);padding:0;justify-content:center}
.tbtn.sq .ic{width:62%;height:62%}
.ig{display:grid;grid-template-columns:auto auto;gap:6px}
.ich{width:28px;height:28px;vertical-align:middle}
.cardlist{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.cardopt{display:flex;align-items:center;gap:14px;text-align:left;min-height:84px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line-ui,var(--line));background:var(--surface2);color:var(--ink)}
.cardic{flex:0 0 64px;width:64px;height:64px}
.cardtx{display:flex;flex-direction:column;gap:3px;min-width:0}
.cardtx b{font-size:17px}
.cardtx small{font-size:14px;color:var(--muted);line-height:1.3}
.cardrect{display:inline-block;width:.62em;height:.9em;border-radius:2px;background:linear-gradient(135deg,#F0B429 50%,#E5484D 50%);vertical-align:middle;transform:rotate(14deg);box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.pn.pnx{display:inline-flex;align-items:center;justify-content:flex-end}
.pn .sxic.ic{width:1.1em;height:1.1em}
.plrow.sx-inj .pt,.plrow.sx-dis .pt{color:#E5484D}
.plrow.sx-exp{opacity:.5}
.bigcd{font-size:56px;font-weight:700;text-align:center;margin:12px 0;font-variant-numeric:tabular-nums}
header.top.hc{position:sticky}
.hshade{position:fixed;inset:0;z-index:-1;background:transparent}
.hmenu{position:absolute;right:8px;top:100%;margin-top:4px;z-index:3;display:flex;flex-direction:column;gap:0;padding:6px 14px;border-radius:12px;background:var(--head-bg);color:var(--head-ink);box-shadow:0 6px 18px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);width:max-content;max-width:calc(100vw - 16px)}
.hmenu .hsw{justify-content:space-between;gap:14px;font-size:14px;width:100%}
.stab{width:100%;min-width:0;border:1px solid var(--line);border-collapse:collapse;font-variant-numeric:tabular-nums}
.stab th,.stab td{border:1px solid var(--line);text-align:center;padding:8px 6px;font-size:19px;font-weight:700;background:var(--surface);color:var(--ink)}
.stab thead th{font-size:14px;font-weight:700;color:var(--ink);padding:4px 6px}
.stab thead th.tn{border-top-style:hidden;border-left-style:hidden;background:transparent}
.stab th.tn{text-align:left;max-width:34vw;font-size:16px}
.stab tbody th.tn{color:var(--ink)}
.stab tbody th.tn.dim,.stab tbody td.hw.dim{color:var(--muted);font-weight:600}
.stab .stn{display:flex;align-items:center;gap:6px;min-width:0}
.stlogo{flex:0 0 auto;width:22px;height:22px;object-fit:contain;border-radius:4px;background:#fff;padding:1px}
.stab .hn{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stab td.hw{font-size:22px;font-weight:800}
.stab .won,.stab th.won,.stab td.won{background:#fff;color:#101827}
:root[data-theme="light"] .stab .won,:root[data-theme="light"] .stab th.won,:root[data-theme="light"] .stab td.won{background:var(--acc);color:var(--acc-ink)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .stab .won{background:var(--acc);color:var(--acc-ink)}}
.stab td.live{border-style:dashed}

.fxteam .nm:has(+ .favstar){flex:0 1 auto}
.fxteam .favstar{margin-left:0}
.favstar{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex:0 0 auto;width:34px;height:34px;margin-left:4px;border-radius:50%;cursor:pointer}
.favstar .ic{width:22px;height:22px}
.clubhead .favstar{width:40px;height:40px}
.clubhead .favstar .ic{width:26px;height:26px}
.champtitle{position:relative;justify-content:center;margin:2px 0 4px;padding:0 40px}.champtitle .favstar{position:absolute;right:0}.champtitle h3{margin:0;text-align:center;font-size:1.35rem;font-family:var(--font-d)}
.cups{display:grid;grid-template-columns:repeat(6,1fr) 30px;gap:6px;margin:8px 0 4px}
.cupbtn{min-height:0;padding:6px 2px 4px;justify-content:center;flex-direction:column;gap:2px}
.cuplb{display:block;font-size:.62rem;line-height:1;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.cupbtn svg{width:100%;max-width:52px;height:auto;display:block}
.cupbtn[aria-pressed=true]{border-color:var(--a);box-shadow:inset 0 0 0 2px var(--a);background:var(--surface2)}
.cupmore{font-size:1.4rem;font-weight:700;color:var(--muted)}
.cupbtn:disabled{opacity:.3}
.repc{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);border-left:4px solid var(--line)}
.repc.haute{border-left-color:var(--acc)}
.repc.urgente{border-left-color:var(--danger)}
.repc.done{opacity:.6}
.repc .chip.on,.msgbar .chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.msgtag.rpurgente{color:var(--danger);border-color:var(--danger)}
.msgtag.rpbasse{color:var(--muted);border-color:var(--line)}
textarea[data-bind=rs]{width:100%;resize:vertical;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.mbtn{position:relative}
.mbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:var(--acc-ink);font-size:12px;font-weight:800;line-height:1}
.mbtn .mbadge{position:absolute;top:2px;right:0}
.msgtop h2{margin:0}
.msgths{display:flex;flex-direction:column;gap:8px}
.msgth{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left}
.msgth.unread{border-color:var(--acc)}
.msgth .mtt{display:flex;flex-direction:column;min-width:0;flex:1}
.msgth .mtt small{color:var(--muted);font-size:13px}
.msgth .mts{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgth.unread .mts{color:var(--ink);font-weight:600}
.msgth .mtr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.msgth .mtr small{color:var(--muted);font-size:12px}
.msglist{display:flex;flex-direction:column;gap:8px}
.msgb{align-self:flex-start;max-width:88%;padding:8px 12px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.msgb.me{align-self:flex-end;background:var(--surface);border-color:var(--a)}
.msgb.ann{border-left:4px solid var(--acc)}
.msgb.pend{opacity:.6}
.msgb p{margin:4px 0 0;overflow-wrap:anywhere}

/* ---------- Outils ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(ms){ var s = Math.floor(ms/1000); var m = Math.floor(s/60); return String(m).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
function sortP(a,b){ return (parseInt(effNum(a),10)||999) - (parseInt(effNum(b),10)||999); }
/* Numéros par défaut : un joueur sans numéro reçoit, à l'affichage, le plus petit numéro libre de son équipe */
function defNums(){
  var map = {};
  S.teams.forEach(function(tm){
    var used = {}, n = 1;
    tm.players.forEach(function(p){ if(p.num) used[String(p.num)] = 1; });
    tm.players.forEach(function(p){ if(!p.num){ while(used[String(n)]) n++; map[p.id] = String(n); used[String(n)] = 1; } });
  });
  return map;
}
function effNum(p){ if(!p) return ''; if(p.num) return p.num; return defNums()[p.id] || ''; }
function numTaken(t, num, exceptPid){
  var v = String(num || '').trim();
  if(!v) return false;
  return S.teams[t].players.some(function(p){ return p.id !== exceptPid && String(p.num || '').trim() === v; });
}
function showNumErr(t, msg){
  var els = document.querySelectorAll('[data-numerr="' + t + '"]');
  for(var i = 0; i < els.length; i++){ els[i].textContent = msg || ''; els[i].style.display = msg ? 'block' : 'none'; }
}
function norm(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function slug(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function stamp(){ return new Date().toISOString().slice(0,10); }

function migrate(s){
  var d = newState();
  s.clubs = s.clubs || []; s.champs = s.champs || [];
  s.champs.forEach(function(c){ var pm = /^PH ([ABC])$/.exec(c.name || ''); if(pm) c.name = 'Promotion Honneur ' + pm[1]; });
  s.clubs.forEach(function(c){ if(c.members === undefined) c.members = []; if(!c.teams){ c.teams = [{ id:c.id, name:c.name, memberIds:c.members.map(function(m){ return m.id; }), squad:c.squad || null }]; delete c.squad; } if(!c.teams.some(function(t){ return t.id === c.id; })) c.teams.unshift({ id:c.id, name:c.name, memberIds:[], squad:null }); c.teams.forEach(function(t){ if(!t.memberIds) t.memberIds = []; }); });
  s.champs.forEach(function(c){
    c.fixtures = c.fixtures || [];
    c.fixtures.forEach(function(f){ if(f.time === undefined) f.time = ''; if(f.place === undefined) f.place = ''; });
    (c.matches || []).forEach(function(m){ if(m.ref === undefined) m.ref = null; if(m.sets === undefined) m.sets = null; if(!m.source) m.source = 'manual'; });
  });
  if(!s.agenda) s.agenda = [];
  if(!s.roles) s.roles = [];
  if(!s.requests) s.requests = [];

function coherence(){

/* répare : retire les références à des équipes ou membres qui n'existent plus, et les liens cassés */

  S.clubs.forEach(function(c){ teamIds[c.id] = 1; (c.teams || []).forEach(function(t){ teamIds[t.id] = 1; }); c.members.forEach(function(m){ memIds[m.id] = 1; }); });
  S.champs.forEach(function(ch){

function rotate(t, dir){
  var L = S.lineup[t];
  S.lineup[t] = dir > 0 ? L.slice(1).concat(L[0]) : [L[5]].concat(L.slice(0,5));
}
function isDecisive(){ return S.sets.length === 2 * S.cfg.setsToWin - 2; }
/* Bouton « inverser » : au début du 1er set et du set décisif, tant que le service n'est pas donné */
/* Le service n'est demandé qu'au 1er set et au set décisif ; aux autres sets il passe automatiquement à l'équipe qui n'a pas servi en premier au set précédent */
function pickSet(){ return S.sets.length === 0 || isDecisive(); }
function atStart(){ return S.stage === 'play' && !S.finished && S.cur[0] + S.cur[1] === 0 && pickSet(); }
function showSwap(){ return atStart() && (S.serving === null || !S.clock.running); }
function showServe(){ return atStart(); }
function scoreFor(team){
  if(S.serving !== null && S.serving !== team) rotate(team, 1);
  if(S.serving === null) S.firstSrv = team;
  S.cur[team]++; S.serving = team;
  /* set décisif : changement de côté une seule fois, dès qu'une équipe atteint 8 points */
  if(isDecisive() && !S.midSwap && Math.max(S.cur[0], S.cur[1]) >= 8){
    S.swap = !S.swap; S.midSwap = true;
    ui.msg = 'Changement de côté à 8 points : la saisie des scores est inversée.';
  }
}

/* ---------- Historique (annuler) ---------- */
function snap(){
  S.history.push({ ev:S.events.length, cur:S.cur.slice(), sets:S.sets.map(function(x){ return x.slice(); }),
    serving:S.serving, timeouts:S.timeouts.slice(), subs:S.subs.slice(), finished:S.finished,
    lineup:S.lineup.map(function(a){ return a.slice(); }), swap:S.swap, midSwap:S.midSwap, firstSrv:S.firstSrv,
    starters:S.starters.map(function(a){ return a.slice(); }), subPairs:JSON.parse(JSON.stringify(S.subPairs)), sanc:JSON.parse(JSON.stringify(S.sanc)),
    clk:{ running:S.clock.running, acc:clockMs() } });
  if(S.history.length > 80) S.history.shift();
}
function undo(){
  var h = S.history.pop();
  if(!h) return;
  var removed = S.events.length > h.ev;            /* un événement va être retiré (et pas seulement une rotation) */
  S.events.length = h.ev;
  S.cur = h.cur; S.sets = h.sets; S.serving = h.serving; S.timeouts = h.timeouts; S.subs = h.subs; S.finished = h.finished; S.lineup = h.lineup;
  if(h.swap !== undefined){ S.swap = h.swap; S.midSwap = h.midSwap; }
  if(h.firstSrv !== undefined) S.firstSrv = h.firstSrv;
  if(h.starters){ S.starters = h.starters; S.subPairs = h.subPairs; }
  if(h.sanc) S.sanc = h.sanc;
  S.tc = null; ui.sheet = null;
  if(removed){
    /* le chrono revient au niveau de l'événement d'avant (ou à zéro s'il n'y en a pas) ; son état (marche / pause) est conservé,
       sauf si c'est ce point qui l'avait fait démarrer : il s'arrête alors à zéro */
    var prev = S.events[S.events.length - 1], target = prev ? prev.t : 0;
    if(!prev && h.clk && !h.clk.running && h.clk.acc === 0){ S.clock = { running:false, since:0, acc:0 }; }
    else { var was = S.clock.running; S.clock.acc = target; S.clock.since = Date.now(); S.clock.running = was; }
  }
  save(); render();
}
/* texte décrivant la dernière action annulable (pour la fenêtre de confirmation) */
function lastActionText(){
  var h = S.history[S.history.length - 1];
  if(!h) return '';
  if(S.events.length > h.ev) return evText(S.events[S.events.length - 1]);
  return 'Échange de joueurs ou changement de composition';
}
function addEvent(e){
  var base = { n:S.events.length + 1, set:setNumber(), t:clockMs(), ts:new Date().toISOString(), score:S.cur.slice() };
  S.events.push(Object.assign(base, e));
}

/* ---------- Chrono ---------- */
var wl = null;
function keepAwake(){
  try{
    if('wakeLock' in navigator && !wl){
      navigator.wakeLock.request('screen').then(function(l){ wl = l; l.addEventListener('release', function(){ wl = null; }); }).catch(function(){});
    }
  }catch(e){}
}
function startClock(){ S.clock.since = Date.now(); S.clock.running = true; keepAwake(); }
function stopClock(){ if(S.clock.running){ S.clock.acc += Date.now() - S.clock.since; S.clock.running = false; } }
function toggleClock(){ if(S.clock.running) stopClock(); else startClock(); save(); render(); }
/* Saisir un point relance le chrono s'il était à l'arrêt (au tout début, en pause ou après un retour au menu) */
function autoClock(){ if(!S.clock.running && !S.finished) startClock(); }

/* ---------- Actions de match ---------- */
function commitPoint(team, how, pid){
  ui.msg = ''; snap(); autoClock();
  scoreFor(team);
  addEvent(Object.assign({ type:'point', team:team, how:how }, pinfo(findPlayer(team, pid))));
  afterPoint();
}
function commitFault(team, kind, pid){
  ui.msg = ''; snap(); autoClock();
  scoreFor(1 - team);
  addEvent(Object.assign({ type:'fault', team:team, how:kind, pointFor:1 - team }, pinfo(findPlayer(team, pid))));
  afterPoint();
}
function afterPoint(){
  save();
  var w = setWinner();
  ui.sheet = w !== null ? { kind:'setend', winner:w } : null;
  render();
}
/* ---------- Remplacements : 6 par set ; règle du titulaire ---------- */
/* Un titulaire (joueur sur le terrain au début du set) sort au plus une fois par set et ne revient qu'à sa position,
   à la place du remplaçant qui l'a remplacé. Ce remplaçant ne peut être remplacé que par lui, puis ne revient plus.
   subPairs[t] : { starter, sub, done } — « done » quand le titulaire est revenu (ou après un remplacement exceptionnel). */
function pairOfSub(t, id){ return S.subPairs[t].filter(function(x){ return x.sub === id; })[0] || null; }
function pairOfStarter(t, id){ return S.subPairs[t].filter(function(x){ return x.starter === id; })[0] || null; }
/* remplaçants qui peuvent entrer librement : jamais entrés dans ce set, et pas un titulaire déjà sorti */
function freeBench(t){
  return availBench(t).filter(function(p){ return !pairOfSub(t, p.id) && !pairOfStarter(t, p.id); });
}
function subOuts(t, exceptional){
  return onCourt(t).filter(function(p){
    if(exceptional) return true;
    var asSub = pairOfSub(t, p.id);
    if(asSub) return !asSub.done;          /* remplaçant sur le terrain : seul son titulaire peut revenir */
    if(pairOfStarter(t, p.id)) return false; /* titulaire déjà sorti puis revenu : plus de sortie dans ce set */
    return true;
  });
}
function subIns(t, outId, exceptional){
  if(!exceptional){
    var asSub = pairOfSub(t, outId);
    if(asSub && !asSub.done){
      var back = availBench(t).filter(function(p){ return p.id === asSub.starter; });
      if(back.length) return back;
      if(sancOf(t, asSub.starter)) return freeBench(t);
    }
  }
  return freeBench(t);
}
function commitSub(team, outId, inId, exceptional, quiet){
  var L = S.lineup[team], idx = L.indexOf(outId), o = findPlayer(team, outId), i = findPlayer(team, inId);
  if(idx < 0 || !o || !i) return false;
  if(!exceptional){
    if(S.subs[team] >= 6) return false;
    if(!subOuts(team, false).some(function(p){ return p.id === outId; })) return false;
    if(!subIns(team, outId, false).some(function(p){ return p.id === inId; })) return false;
  }
  if(!quiet) snap();
  if(!S.starters[team].length) S.starters[team] = L.filter(Boolean);   /* les titulaires du set sont ceux qui étaient sur le terrain */
  var pairs = S.subPairs[team], back = pairOfSub(team, outId);
  if(exceptional){
    if(back) back.done = true;                                        /* le titulaire remplacé ne pourra plus revenir */
    pairs.push({ starter:outId, sub:inId, done:true, exc:true });
  } else if(back && !back.done && !sancOf(team, back.starter)){
    back.done = true;                                                 /* retour du titulaire à sa position */
  } else {
    pairs.push({ starter:outId, sub:inId, done:false });
  }
  L[idx] = inId; S.subs[team]++;
  addEvent(Object.assign({ type:'sub', team:team, exc:!!exceptional, how:'entre ' + plabel(effNum(i), i.name) + (exceptional ? ' (exceptionnel)' : '') }, pinfo(o)));
  save();
  return true;
}

/* ---------- Blessure et cartons ---------- */
/* Remplaçants possibles pour un joueur qui sort : d'abord selon les règles ; sinon (ou si plus personne) remplacement exceptionnel avec n'importe quel joueur du banc */
function replCands(t, out){
  var reg = (S.subs[t] < 6 && subOuts(t, false).some(function(p){ return p.id === out; })) ? subIns(t, out, false) : [];
  if(reg.length) return { list:reg, exc:false };
  return { list:availBench(t).filter(function(p){ return p.id !== out; }), exc:true };
}
function commitInjury(team, outId, inId, exc){
  var o = findPlayer(team, outId);
  if(!o) return false;
  snap(); autoClock();
  addEvent(Object.assign({ type:'injury', team:team, how:'Blessure' }, pinfo(o)));
  if(inId && !commitSub(team, outId, inId, exc, true)) return false;
  S.sanc[team][outId] = 'inj';
  save(); return true;
}
/* Équipe qui ne peut pas compléter son équipe : l'adversaire reçoit les points nécessaires pour gagner le set */
function giveSetTo(opp, why, pinf){
  var team = 1 - opp, goal = Math.max(target(), S.cur[team] + 2), pts = Math.max(0, goal - S.cur[opp]);
  if(S.serving === null) S.firstSrv = opp;
  S.cur[opp] = Math.max(S.cur[opp], goal); S.serving = opp;
  addEvent(Object.assign({ type:'forfeit', team:team, how:why, pts:pts }, pinf || {}));
}
function injRecStart(team, out){
  snap(); autoClock();
  addEvent(Object.assign({ type:'injury', team:team, how:'Blessure', res:'décompte de 3 minutes' }, pinfo(findPlayer(team, out))));
  ui.sheet = { kind:'injrec', team:team, out:out, ev:S.events.length - 1, step:'wait', endsAt:Date.now() + 180000 };
  save(); render();
}
function injRecEnd(sh, res){ var e = S.events[sh.ev]; if(e) e.res = res; }
var CARDS = { jaune:'Carton jaune', rouge:'Carton rouge', expul:'Cartons jaune + rouge ensemble', disq:'Cartons jaune et rouge séparés' };
var CARDHOW = { jaune:'Avertissement', rouge:'Pénalité (point et service à l\'adversaire)', expul:'Expulsion pour le set', disq:'Disqualification pour le match' };
function commitCard(team, kind, pid, inId, exc){
  var p = pid ? findPlayer(team, pid) : null;
  snap(); autoClock();
  if(kind === 'rouge'){
    scoreFor(1 - team);
    addEvent(Object.assign({ type:'card', team:team, card:kind, how:CARDHOW[kind], pointFor:1 - team }, pinfo(p)));
    afterPoint(); return;
  }
  addEvent(Object.assign({ type:'card', team:team, card:kind, how:CARDHOW[kind] }, pinfo(p)));
  if((kind === 'expul' || kind === 'disq') && p){
    var onC = S.lineup[team].indexOf(pid) >= 0;
    if(onC && inId) commitSub(team, pid, inId, exc, true);
    S.sanc[team][pid] = kind === 'expul' ? 'exp' : 'dis';
  }
  save(); ui.sheet = null; render();
}
function callTimeout(team){
  if(S.timeouts[team] >= 2 || S.finished) return;
  snap(); S.timeouts[team]++;
  addEvent({ type:'timeout', team:team });
  S.tc = { team:team, endsAt:Date.now() + 30000 };
  save(); render();
}
function manualRotate(t, dir){
  snap(); rotate(t, dir); save(); render();
}
function endSet(){
  snap();
  var a = S.cur[0], b = S.cur[1];
  addEvent({ type:'setEnd', how:a + '-' + b });
  S.sets.push([a,b]);
  S.cur = [0,0]; S.timeouts = [0,0]; S.subs = [0,0]; S.starters = [[],[]]; S.subPairs = [[],[]]; S.serving = null; S.tc = null;
  S.sanc = S.sanc.map(function(m){ var o = {}; Object.keys(m).forEach(function(k){ if(m[k] !== 'exp') o[k] = m[k]; }); return o; });   /* l'expulsion ne vaut que pour le set */
  var w = setsWon();
  var prevFirst = (S.firstSrv === null || S.firstSrv === undefined) ? 0 : S.firstSrv;
  ui.sheet = null; S.midSwap = false;
  if(!(w[0] >= S.cfg.setsToWin || w[1] >= S.cfg.setsToWin)){
    if(isDecisive()) S.firstSrv = null; else { S.serving = 1 - prevFirst; S.firstSrv = S.serving; }
    S.swap = !S.swap;
    ui.msg = 'Changement de côté : la saisie des scores est inversée.';
    var pm = planApply(S.sets.length + 1); if(pm) ui.msg += ' ' + pm;
  }
  if(w[0] >= S.cfg.setsToWin || w[1] >= S.cfg.setsToWin){
    S.finished = true;
    addEvent({ type:'matchEnd', set:S.sets.length, how:w[0] + '-' + w[1], score:[a,b] });
    stopClock();
    var fr = S.fixtureRef, ae = (fr && !fr.cid) ? calEntry('', fr.fid) : null;
    if(ae && ae.kind === 'amical'){
      ae.f.result = { hs:w[0], as:w[1], sets:S.sets.map(function(x){ return x.slice(); }), source:'live', ref:S.created };
      ui.msg = 'Résultat ajouté au calendrier.';
    } else {
      var fch = fr && champById(fr.cid), ff = fch && fixtureOf(fch, fr.fid), done = null;
      if(ff) done = addToChamp(fr.cid, ff.home, ff.away, ff.id);
      else if(champById(S.matchChamp)){
        var mch = champById(S.matchChamp), k0 = S.teams[0].clubId, k1 = S.teams[1].clubId;
        if(k0 && k1 && k0 !== k1 && mch.clubIds.indexOf(k0) >= 0 && mch.clubIds.indexOf(k1) >= 0) done = addToChamp(mch.id, k0, k1);
        else ui.sheet = champSheet(mch.id);
      }
      if(done) ui.msg = ff ? 'Résultat ajouté au calendrier de ' + fch.name + '.' : 'Résultat ajouté à ' + champById(S.matchChamp).name + '.';
      else if(!ui.sheet && champs().length) ui.sheet = champSheet(null);
    }
  }
  save(); render();
}
/* ---------- Bibliothèque de matchs (nouveau / reprendre) ---------- */
var MATCH_KEYS = ['created','title','teams','lineup','cfg','sets','cur','serving','timeouts','subs','events','history','finished','clock','tc','fixtureRef','matchChamp','prepared','champAdded','swap','midSwap','firstSrv','starters','plan','subPairs','sanc','titleAuto','mode','modeSet'];
function hasContent(){ return S.events.length > 0 || S.sets.length > 0; }
function matchSnapshot(){
  var o = {};
  MATCH_KEYS.forEach(function(k){ o[k] = JSON.parse(JSON.stringify(S[k] === undefined ? null : S[k])); });
  o.clock = { running:false, since:0, acc:clockMs() };
  o.tc = null;
  o.savedAt = new Date().toISOString();
  return o;
}
function archiveCurrent(){
  if(!hasContent()) return;
  S.library = S.library.filter(function(x){ return x.created !== S.created; });
  S.library.unshift(matchSnapshot());
  if(S.library.length > 40) S.library.length = 40;
}
function loadMatch(created){
  var e = S.library.filter(function(x){ return x.created === created; })[0];
  if(!e) return false;
  stopClock(); archiveCurrent();
  S.library = S.library.filter(function(x){ return x.created !== created; });
  MATCH_KEYS.forEach(function(k){ S[k] = JSON.parse(JSON.stringify(e[k])); });
  S.clock = { running:false, since:0, acc:(e.clock && e.clock.acc) || 0 };
  S.tc = null; S.prepared = true; S.stage = 'play';
  ui.teamOther = [false, false]; ui.prepTeam = null;
  return true;
}
function keepShared(){
  return { teams:JSON.parse(JSON.stringify(S.teams)), lineup:S.lineup.map(function(x){ return x.slice(); }), cfg:S.cfg,
    clubs:S.clubs, champs:S.champs, prefs:S.prefs, library:S.library, homeClub:S.homeClub, adminId:S.adminId, fav:S.fav, agenda:S.agenda, seasons:S.seasons, season:S.season, roles:S.roles, requests:S.requests, pres:S.pres, msgs:S.msgs, msgSeen:S.msgSeen, reports:S.reports, licFin:S.licFin, sync:S.sync, sb:S.sb };
}
function resetForNew(){
  stopClock(); archiveCurrent();
  S = Object.assign(newState(), keepShared());
  S.stage = 'setup';
  ui.teamOther = [false, false]; ui.prepTeam = null;
}
/* Supprime le match courant (sans l'archiver) : on repart d'un match vierge, équipes et joueurs conservés */
function discardCurrent(){
  stopClock();
  S = Object.assign(newState(), keepShared());
  S.stage = 'home';
}
function newMatch(){
  resetForNew();
  setTab('match'); ui.showSetup = false; ui.resume = false; ui.sheet = null; ui.msg = '';
  save(); render(); window.scrollTo(0,0);
}
function matchSummary(m){
  var w = [0,0];
  (m.sets || []).forEach(function(s){ if(s[0] > s[1]) w[0]++; else w[1]++; });
  var n0 = ((m.teams[0].name || '').trim()) || 'Équipe A', n1 = ((m.teams[1].name || '').trim()) || 'Équipe B';
  return { title:((m.title || '').trim()) || (n0 + ' – ' + n1), w:w, cur:m.cur, finished:!!m.finished, setNo:(m.sets || []).length + 1, date:m.savedAt || m.created };
}
/* « Match existant » : seulement les matchs non terminés (les autres restent consultables dans Données) */
function savedMatches(){
  var out = [];
  if((hasContent() || S.prepared) && !S.finished) out.push({ cur:true, m:S });
  S.library.forEach(function(e){ if(!e.finished) out.push({ cur:false, m:e }); });
  return out;
}

/* ---------- Statistiques ---------- */
function tnOf(m, i){ return ((m.teams[i].name || '').trim()) || (i ? 'Équipe B' : 'Équipe A'); }
function setsWonOf(m){ var w = [0,0]; (m.sets || []).forEach(function(s){ if(s[0] > s[1]) w[0]++; else w[1]++; }); return w; }
function statsRowsOf(m){
  var map = {};
  function get(e){
    var k = e.team + '|' + (e.pid || 'none');
    return map[k] || (map[k] = { team:e.team, pid:e.pid || null, num:e.num, name:e.name || 'Non attribué', pts:0, attack:0, block:0, ace:0, relance:0, faults:0 });
  }
  m.events.forEach(function(e){
    if(e.type === 'point'){ var r = get(e); r.pts++; if(r[e.how] != null) r[e.how]++; }
    else if(e.type === 'fault' || (e.type === 'card' && e.card === 'rouge')){ get(e).faults++; }
  });
  return Object.keys(map).map(function(k){ return map[k]; });
}
function statsRows(){ return statsRowsOf(S); }
function playerStatOf(m, pid){
  var r = { pts:0, attack:0, block:0, ace:0, relance:0, faults:0 };
  m.events.forEach(function(e){
    if(e.pid !== pid) return;
    if(e.type === 'point'){ r.pts++; if(r[e.how] != null) r[e.how]++; }
    else if(e.type === 'fault' || (e.type === 'card' && e.card === 'rouge')) r.faults++;
  });
  return r;
}
function playerStat(pid){ return playerStatOf(S, pid); }
function evTextOf(m, e){
  var who = plabel(e.num, e.name) + (e.pid && e.team != null && isCapOf(m, e.team, e.pid) ? CAPMARK : '');
  switch(e.type){
    case 'point': return 'Point ' + tnOf(m, e.team) + (who ? ' · ' + who : '') + (e.how ? ' · ' + (HOW[e.how] || e.how) : '');
    case 'fault': return 'Faute ' + tnOf(m, e.team) + ' · ' + e.how + (who ? ' · ' + who : '');
    case 'sub': if(e.count) return 'Remplacement ' + tnOf(m, e.team) + ' (' + e.count + '/6)';
      return (e.exc ? 'Remplacement exceptionnel ' : 'Remplacement ') + tnOf(m, e.team) + ' · sort ' + (who || '?') + ' · ' + e.how;
    case 'timeout': return 'Temps mort ' + tnOf(m, e.team);
    case 'injury': return 'Blessure ' + tnOf(m, e.team) + (who ? ' · ' + who : '') + (e.res ? ' · ' + e.res : '');
    case 'forfeit': return e.how + ' · set gagné par ' + tnOf(m, 1 - e.team) + ' (' + e.pts + ' point' + (e.pts > 1 ? 's' : '') + ' attribué' + (e.pts > 1 ? 's' : '') + ')';
    case 'card': {
      var cl = { jaune:'Carton jaune · avertissement', rouge:'Carton rouge · pénalité : point et service à ' + tnOf(m, 1 - e.team), expul:'Cartons jaune + rouge ensemble · expulsion pour le set', disq:'Cartons jaune et rouge séparés · disqualification pour le match' }[e.card] || 'Carton';
      return cl + ' · ' + tnOf(m, e.team) + (who ? ' · ' + who : '');
    }
    case 'setEnd': return 'Fin du set ' + e.set + ' · ' + e.how.replace('-', ' – ');
    case 'matchEnd': return 'Fin du match · ' + e.how.replace('-', ' – ') + ' en sets';
  }
  return e.type;
}
function evText(e){ return evTextOf(S, e).replace(CAPMARK, ' (cap.)'); }

/* ---------- Couleurs des équipes, tirées des logos ---------- */
/* Chaque logo donne ses couleurs dominantes (hors transparence et blanc). Une équipe prend un fondu entre 2 d'entre elles.
   Si les deux équipes sont trop proches, on cherche parmi les 3 couleurs dominantes de chacune une combinaison plus distincte. */
var PAL_VER = 1, SEP_MIN = 28;
var DEF_COLORS = [ { c1:'#1D5FA8', c2:'#1D5FA8' }, { c1:'#0B7A6C', c2:'#0B7A6C' } ];
function toHex(r, g, b){ return '#' + [r, g, b].map(function(v){ return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'); }).join('').toUpperCase(); }
function rgbOf(h){ return [parseInt(h.slice(1,3), 16), parseInt(h.slice(3,5), 16), parseInt(h.slice(5,7), 16)]; }
function lin(v){ v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
function lumOf(h){ var c = rgbOf(h).map(lin); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
function contrastOf(h1, h2){ var a = lumOf(h1) + 0.05, b = lumOf(h2) + 0.05; return a > b ? a / b : b / a; }
function labOf(h){
  var c = rgbOf(h).map(lin);
  var x = (c[0] * 0.4124 + c[1] * 0.3576 + c[2] * 0.1805) / 0.95047, y = c[0] * 0.2126 + c[1] * 0.7152 + c[2] * 0.0722, z = (c[0] * 0.0193 + c[1] * 0.1192 + c[2] * 0.9505) / 1.08883;
  function f(t){ return t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116; }
  var fx = f(x), fy = f(y), fz = f(z);
